# Declarative org repo-settings desired-state (DEV-519).
#
# Enforced across every non-archived repo in the org by the reconciler:
#   .github/workflows/org-repo-settings-reconcile.yml → scripts/org-repo-settings-reconcile.sh
#
# WHY THIS EXISTS: some per-repo settings can't be enforced by org rulesets —
# there is no ruleset rule for merge method, and the flags are per-repo. The
# org-wide `required_linear_history` (in `spice-branch-protection`) forbids merge
# *commits* but still allows rebase-merge, which bypasses the squash-only policy
# and the Conventional-Commits PR-title check. API-level reconciliation is the
# only lever, so this file is the desired-state and the workflow reconciles to it.
#
# HOW TO ADD A NEW ENFORCED SETTING: add a key under `policies`. Each leaf key is
# a literal field of GitHub's "Update a repository" REST API
# (PATCH /repos/{owner}/{repo} — https://docs.github.com/en/rest/repos/repos#update-a-repository).
# No code change is needed — the reconciler diffs each field against the live
# repo and PATCHes on drift (idempotent).
#
# GROUPS ARE THE COUPLING BOUNDARY: when any field in a group drifts, the
# reconciler sends that group's fields TOGETHER in one PATCH. GitHub validates
# some fields as a set, against the request's defaults rather than the repo's
# stored values — sending `squash_merge_commit_message: PR_BODY` alone is
# rejected (422 invalid_squash_commit_setting_combo) even on a repo whose stored
# `squash_merge_commit_title` is PR_TITLE, because the omitted title defaults to
# COMMIT_OR_PR_TITLE, which cannot pair with PR_BODY. So: keep co-validated
# fields in the same group. Splitting them across groups will 422 at apply time.
#
# The top-level group names (e.g. `merge`) are for human organization, for
# per-group exceptions, and for that PATCH grouping; they are not sent to the API.

# Reconciler behavior knobs (not repo settings).
options:
  # Skip forks entirely. Forks can still be reconciled by default; flip this to
  # true to exclude all forks, or opt out individual forks via the exception
  # property below (which is finer-grained).
  exclude_forks: false

  # Custom-property opt-out, following the `ci-exception` model used by the CI
  # floor rulesets. Set this property on a repo to exclude it:
  #   value "all" or "*"        → skip the repo entirely
  #   value "merge" (a group)   → skip only that policy group; reconcile the rest
  #   value "team_access"       → skip the team-access pass only (see below)
  #   comma-separated groups    → skip each listed group / pass
  #   unset / empty             → fully reconciled
  exception_property: repo-settings-exception

# Desired repo settings. First policy: squash-only merge (org standard).
# Eng-Cookbook (DEV-515) was set to this state by hand as the reference.
policies:
  merge:
    allow_squash_merge: true
    allow_merge_commit: false
    allow_rebase_merge: false
    squash_merge_commit_title: PR_TITLE
    squash_merge_commit_message: PR_BODY

# Team repo-access desired-state (DEV-525). A SEPARATE concern from `policies`
# above: granting a team access to a repo is NOT a field of the repo-update API
# — it is its own endpoint (PUT /orgs/{org}/teams/{slug}/repos/{owner}/{repo}) —
# so the reconciler handles these in a dedicated pass.
#
# FLOOR SEMANTICS (unlike `policies`, which are exact-match): each entry ensures
# the team has AT LEAST the given permission on every reconciled repo. A higher
# existing grant is left untouched — the reconciler never downgrades a team.
#
# WHY: Pepper escalates low-confidence PRs to the `reviewers` team (DEV-524), and
# a GitHub team review request only lands if the team has >= read access to the
# repo. Granting per-repo by hand drifts as repos are added; this makes it an
# invariant. Forks are included (Pepper reviews them too); archived repos are not
# scanned. Skippable per-repo via the exception property (value `team_access`).
#
# Each key is a team slug in THIS org; `permission` is one of GitHub's team
# repo-permission levels: pull | triage | push | maintain | admin.
team_access:
  reviewers:
    permission: pull
