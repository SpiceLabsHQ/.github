# Drop this file into each SpiceLabsHQ repo as `.github/workflows/actions-audit.yml`.
# It calls the centrally maintained reusable workflow in SpiceLabsHQ/.github.
#
# What it does:
#   - Runs zizmor against the repo's .github/workflows/** to surface dangerous
#     GHA patterns (template injection, excessive permissions, pwn requests).
#   - Enforces 40-char SHA pins on every third-party `uses:` reference.
#   - Uploads zizmor findings to the Security tab as SARIF.
#
# No secrets needed.

name: Actions Audit

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

jobs:
  audit:
    # @actions-audit-v1 floats within major 1 (non-breaking updates only). To harden, pin an
    # immutable @actions-audit-vX.Y.Z tag or a commit SHA — see README → "Versioning & releases".
    uses: SpiceLabsHQ/.github/.github/workflows/actions-audit.yml@actions-audit-v1
    permissions:
      contents: read
      security-events: write
      actions: read
    # with:
    #   min_severity: high                          # default: medium  (one of: low, medium, high)
    #   allow_tags_for: "actions/*,github/*,aws-actions/*"  # default: "actions/*,github/*"
