# Drop this file into each SpiceLabsHQ repo as `.github/workflows/pepper-pr-review.yml`.
# It calls the centrally maintained reusable workflow in SpiceLabsHQ/.github.
#
# Optional per-repo customization:
#   - Add `.pepper/pr-review-standards.md` for repo-specific review standards.
#   - Override inputs in the `with:` block below (model, aws_region, etc.).
#
# Required org-level secrets (set once on the SpiceLabsHQ org):
#   - AWS_CLAUDE_BEDROCK_ROLE_ARN        — shared AWS role for Bedrock OIDC
#   - PEPPER_PR_REVIEW_APP_ID            — GitHub App ID (needed for formal PR approvals)
#   - PEPPER_PR_REVIEW_APP_PRIVATE_KEY   — GitHub App private key
#
# Optional org-level secret:
#   - LINEAR_API_KEY                     — enables Linear issue verification

name: Pepper PR Review

# DO NOT add `pull_request_target` here. That event runs in the base repo's
# context with full secret access even for fork PRs and would let a malicious
# fork diff exfiltrate secrets. Plain `pull_request` is safe because GitHub
# strips secrets from fork PR runs. The reusable workflow further gates
# `issue_comment` to org members only.
#
# Label lifecycle: while a Pepper review is running, the PR carries the
# `pepper-cooking` label. When the review concludes, that marker is swapped
# for exactly one of `pepper-approved`, `pepper-changes-requested`, or
# `pepper-needs-review`. If the workflow fails before Pepper finishes, the
# always-on cleanup step removes `pepper-cooking` and the PR ends up
# unlabeled — the workflow's run status is the failure signal in that case.
#
# `synchronize`/`reopened` mirror the org code floor (floor-pepper.yml) so a
# push to an already-open PR — a Renovate rebase, or a fix after review
# dismissal — re-runs Pepper instead of stranding the PR at REVIEW_REQUIRED
# (DEV-497). If your repo is under the code floor, floor-pepper already provides
# this coverage and a standalone caller is redundant; this example is for repos
# outside the floor or that want Pepper before the floor's required check.
# Duplicate runs on an unchanged head SHA are short-circuited pre-model (DEV-523).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pepper:
    # @pepper-pr-review-v1 floats within major 1 (non-breaking updates only). To harden, pin an
    # immutable @pepper-pr-review-vX.Y.Z tag or a commit SHA — see README → "Versioning & releases".
    uses: SpiceLabsHQ/.github/.github/workflows/pepper-pr-review.yml@pepper-pr-review-v1
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
      issues: read
    secrets:
      AWS_CLAUDE_BEDROCK_ROLE_ARN: ${{ secrets.AWS_CLAUDE_BEDROCK_ROLE_ARN }}
      PEPPER_PR_REVIEW_APP_ID: ${{ secrets.PEPPER_PR_REVIEW_APP_ID }}
      PEPPER_PR_REVIEW_APP_PRIVATE_KEY: ${{ secrets.PEPPER_PR_REVIEW_APP_PRIVATE_KEY }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
    # with:
    #   # Per-mode model overrides. Both default to AWS Application Inference Profiles
    #   # tagged for cost allocation (Product=pepper, Mode=review|on-demand) so spend
    #   # shows up split by flow in Cost Explorer. Override only if a repo needs a
    #   # different model — overrides bypass the tagged profiles, so cost attribution
    #   # for that repo will collapse back into the underlying foundation model.
    #   review_model: arn:aws:bedrock:us-west-2:618640261060:application-inference-profile/cz21awrop223
    #   on_demand_model: arn:aws:bedrock:us-west-2:618640261060:application-inference-profile/68jw718dw1jv
    #   model: us.anthropic.claude-opus-4-1-20250805-v1:0   # legacy: wins for both modes, forfeits cost attribution
    #   aws_region: us-east-1
    #   reviewers_team: reviewers   # org team slug requested on escalation (default: reviewers)
    #   show_full_output: true   # debug only — exposes Pepper's tool calls and reasoning in Actions logs (visible to anyone who can see the run)
    #   # Review budget (DEV-534). review_timeout_minutes is the hard wall-clock cap (SIGKILL backstop);
    #   # the prompt is told review_timeout_minutes - review_budget_margin_minutes so it files before the wall.
    #   review_timeout_minutes: 50        # default 50; lower it if your runner/latency budget is tighter
    #   review_budget_margin_minutes: 10  # default 10; margin held back from the advertised prompt budget
