# Drop this file into each SpiceLabsHQ repo as `.github/workflows/dependency-review.yml`.
# It calls the centrally maintained reusable workflow in SpiceLabsHQ/.github,
# which wraps actions/dependency-review-action with org-standard severity and
# license policy.
#
# What this catches:
#   - PRs introducing dependencies with CVEs at/above the configured severity
#     (default: high).
#   - PRs introducing dependencies under denied licenses (default: copyleft
#     family — GPL/LGPL/AGPL).
#
# Required: GitHub Advanced Security on private repos, OR public repo. The
# underlying API (Dependency Review) is free for public repos and bundled with
# GHAS for private repos.

name: Dependency Review

on:
  pull_request:

jobs:
  dependency-review:
    uses: SpiceLabsHQ/.github/.github/workflows/dependency-review.yml@v1
    permissions:
      contents: read
      pull-requests: write
    # with:
    #   # Tighten severity threshold to fail only on critical CVEs:
    #   fail_on_severity: critical
    #
    #   # Override the org-default deny-list (e.g. add a license your repo
    #   # specifically can't accept). Comma-separated SPDX identifiers.
    #   deny_licenses: GPL-2.0,AGPL-3.0,LGPL-2.0,LGPL-2.1,LGPL-3.0,AGPL-1.0,SSPL-1.0
    #
    #   # OR switch to allow-list mode — stricter than deny-list, only the
    #   # licenses you list will pass. Setting this causes the reusable
    #   # workflow to ignore `deny_licenses` (the underlying action rejects
    #   # callers that pass both at once). Use when your repo needs a closed
    #   # license policy.
    #   allow_licenses: MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,0BSD
    #
    #   # Suppress the inline PR summary comment (default: true):
    #   comment_summary_in_pr: false
