# Drop this file into each SpiceLabsHQ repo as `.github/workflows/secret-scan.yml`.
# It calls the centrally maintained reusable workflow in SpiceLabsHQ/.github.
#
# Two complementary scan modes are wired up here:
#
#   - pr-diff       — runs on every pull_request. Fast (only the PR's new
#                     commits). Findings appear in the job summary and FAIL the
#                     check so a leak can't merge.
#   - full-history  — runs on push to main AND on a weekly cron. Slow (entire
#                     git history). Catches secrets that slipped past the
#                     pr-diff scanner (e.g., committed in one commit, deleted
#                     in the next — the secret is still in history forever).
#
# Engine: the reusable workflow runs the open-source gitleaks CLI directly. No
# license and no org secret are required (it does NOT use the paid
# gitleaks-action). Nothing to provision.
#
# Optional per-repo customization:
#   - Add `.gitleaks.toml` for repo-specific custom rules / allowlists. The
#     reusable workflow auto-detects the file; absent file → built-in default
#     rules only.
#
# Security tab (optional, public repos only):
#   - On PUBLIC repos, findings are uploaded to GitHub code scanning (the
#     Security tab) for free. This requires `security-events: write` on the
#     calling job — granted below. On private/internal repos that upload is
#     auto-skipped (code scanning there needs paid GitHub Advanced Security),
#     so the permission is simply unused; the scan still runs and still fails
#     the check.

name: Secret Scan

on:
  # Fast diff scan on every PR. Fails the check on a finding.
  pull_request:
  # Full-history sweep when code lands on the default branch. Catches secrets
  # that pr-diff couldn't see because they were committed and "fixed" within
  # the same PR (the secret is still in history).
  push:
    branches: [main]
  # Weekly safety net. Picks up secrets in history that were never caught by
  # PR scans (e.g., the repo adopted scanning *after* the leak was committed).
  schedule:
    - cron: "0 6 * * 1"  # Mondays at 06:00 UTC

# Top-level permissions: each calling job re-declares what it needs (a `uses:`
# job's `permissions:` block must be set on the job, not inherited from here),
# but defining a baseline at the workflow level documents intent.
permissions:
  contents: read
  security-events: write

jobs:
  pr-diff:
    if: github.event_name == 'pull_request'
    uses: SpiceLabsHQ/.github/.github/workflows/secret-scan.yml@v1
    permissions:
      contents: read
      # Only consumed on PUBLIC repos, to upload findings to the Security tab.
      # Unused (and harmless) on private/internal repos.
      security-events: write
    with:
      mode: pr-diff

  full-history-on-push:
    if: github.event_name == 'push'
    uses: SpiceLabsHQ/.github/.github/workflows/secret-scan.yml@v1
    permissions:
      contents: read
      security-events: write
    with:
      mode: full-history

  full-history-weekly:
    if: github.event_name == 'schedule'
    uses: SpiceLabsHQ/.github/.github/workflows/secret-scan.yml@v1
    permissions:
      contents: read
      security-events: write
    with:
      mode: full-history
