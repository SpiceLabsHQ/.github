name: PR Hygiene (reusable)

# Two checks for PRs:
#   1. Title check (BLOCKING): enforces Conventional Commits on the PR title.
#      release-please uses the squashed PR title as the commit message; if the
#      title isn't a valid CC header, release-please can't classify the change
#      and the release notes drift from reality. Failing the check here keeps
#      the contract with release-please honest at merge time.
#   2. Size warning (NON-BLOCKING): posts an informational sticky comment when
#      the PR is unusually large by changed lines OR file count (generated and
#      vendored files are excluded from both counts). Never fails the check —
#      large PRs are a smell, not a violation, and forcing a split via a red X
#      tends to push authors to merge-then-fix instead of split.

on:
  workflow_call:
    inputs:
      types:
        description: |
          Comma-separated list of allowed Conventional Commits types. Converted
          internally to the newline-delimited form that
          amannn/action-semantic-pull-request expects.
        required: false
        type: string
        default: feat,fix,chore,docs,refactor,test,build,ci,perf,style,revert
      require_scope:
        description: |
          When true, the PR title must include a scope, e.g. `feat(api): ...`.
          Defaults to false because most repos in the org are single-scope and
          forcing a scope just adds noise.
        required: false
        type: boolean
        default: false
      large_pr_threshold:
        description: |
          Soft threshold for changed lines (additions + deletions, excluding
          generated/vendored files — see `size_exclude_pattern`) above which the
          size-warning job posts an informational comment. The check itself
          never fails on size — see file header.
        required: false
        type: number
        default: 1000
      large_pr_file_threshold:
        description: |
          Soft threshold for the number of changed files (excluding
          generated/vendored files) above which the size-warning job posts an
          informational comment. Fires independently of `large_pr_threshold`:
          either one crossing triggers the notice. Never fails the check.
        required: false
        type: number
        default: 25
      size_exclude_pattern:
        description: |
          Extended regex (grep -E) of file paths excluded from BOTH size counts,
          so lockfiles, build output, and other generated/vendored files don't
          trip the warning. Override to widen or narrow per repo.
        required: false
        type: string
        default: '(^|/)(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|Cargo\.lock|poetry\.lock|Gemfile\.lock|composer\.lock|go\.sum|uv\.lock|bun\.lockb)$|(^|/)(vendor|node_modules|dist|build|__generated__|__snapshots__)/|\.min\.(js|css)$|\.snap$|\.(pb|pb2)\.(go|py)$|\.generated\.'

# Workflow-level permissions are the union of what both jobs need. Each job
# below restricts further (least privilege per job).
permissions:
  contents: read
  pull-requests: write

jobs:
  title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The action takes `types` as newline-delimited multi-line input. Callers
      # pass a comma-separated string (more ergonomic in YAML), so we convert
      # here. `tr` is sufficient — type names are [a-z]+ and never contain
      # commas or whitespace internally.
      - name: Normalize types to newline-delimited
        id: types
        env:
          TYPES_CSV: ${{ inputs.types }}
        run: |
          set -euo pipefail
          TYPES_NL=$(printf '%s' "${TYPES_CSV}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' || true)
          {
            echo 'list<<TYPES_EOF'
            printf '%s\n' "${TYPES_NL}"
            echo 'TYPES_EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Check PR title (Conventional Commits)
        id: lint
        # SHA-pinned to v6.1.1 (third-party action — must be 40-char SHA per
        # actions-audit policy). Bump by re-running the API tag lookup and
        # updating both the SHA and the trailing comment.
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: ${{ steps.types.outputs.list }}
          requireScope: ${{ inputs.require_scope }}
          # Require something after the type/scope. `.+` is intentionally
          # permissive — we don't enforce capitalization or trailing-period
          # style at the org level; individual repos can override via their
          # own caller if they want stricter rules.
          subjectPattern: '.+'
          subjectPatternError: |
            The PR title subject (text after `type(scope):`) is empty or
            invalid. Provide a short, imperative description of the change.

      # Sticky comment with a fix example whenever the title check fails.
      # `if: always() && error_message != null` is the documented pattern from
      # the action's README: the previous step fails the job, this step still
      # runs and posts the comment. Keeping the same `header:` across runs
      # means the comment is updated in place rather than duplicated.
      - name: Post sticky comment on title failure
        if: always() && steps.lint.outputs.error_message != null
        # SHA-pinned to v3.0.4 (third-party).
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: pr-hygiene-title
          message: |
            ### PR title doesn't follow Conventional Commits

            Your PR title needs to match the [Conventional Commits](https://www.conventionalcommits.org/) format so `release-please` can classify the change.

            **Examples:**
            ```
            feat: add user login
            fix(api): handle null response
            chore(deps): bump actions/checkout to v4
            ```

            **Allowed types:** ${{ inputs.types }}

            **Validator output:**
            ```
            ${{ steps.lint.outputs.error_message }}
            ```

            Edit the PR title and the check will re-run automatically.

      # If the title was previously bad and is now fixed, delete the stale
      # comment so the PR isn't littered with a "you fixed it" trail.
      - name: Clear sticky comment on title pass
        if: steps.lint.outputs.error_message == null
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: pr-hygiene-title
          delete: true

  size:
    name: PR size warning (non-blocking)
    runs-on: ubuntu-latest
    # This job MUST exit 0 even when the PR is over the threshold. The intent
    # is awareness, not enforcement. Branch protection should NOT be
    # configured to require this check.
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Compute changed size
        id: size
        # The size read now makes an API call (per-file breakdown for the
        # generated/vendored filter). A transient API failure must not turn this
        # non-blocking check red — fail open: no outputs, so the post step below
        # simply doesn't fire.
        continue-on-error: true
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LOC_THRESHOLD: ${{ inputs.large_pr_threshold }}
          FILE_THRESHOLD: ${{ inputs.large_pr_file_threshold }}
          EXCLUDE: ${{ inputs.size_exclude_pattern }}
        run: |
          set -euo pipefail
          # The event payload carries only totals (additions/deletions/
          # changed_files), not the per-file breakdown we need to drop
          # generated/vendored files before counting. So pull the file list
          # from the API. GitHub caps this at 3000 files, which is far past any
          # PR a human should be opening; --paginate walks all pages.
          FILES_TSV="${RUNNER_TEMP}/pr_files.tsv"
          gh api --paginate "/repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | [.filename, (.additions|tostring), (.deletions|tostring)] | @tsv' \
            > "${FILES_TSV}"

          # Count changed lines and files, skipping generated/vendored paths.
          # Match the exclusion against the filename FIELD ($1), not the whole
          # TSV row — the pattern anchors lockfiles with `$`, which would never
          # fire against a "<file>\t<add>\t<del>" row. One awk pass, both counts.
          read -r FILES LOC < <(
            awk -F'\t' -v pat="${EXCLUDE}" \
              '$1 !~ pat { files++; loc += $2 + $3 } END { print (files+0), (loc+0) }' \
              "${FILES_TSV}"
          )
          FILES=${FILES:-0}
          LOC=${LOC:-0}

          # Explicit `if` blocks, not `[ ... ] && VAR=true` — the latter returns
          # non-zero when the test is false and can trip `set -e` depending on
          # the shell.
          LOC_OVER=false
          if [ "${LOC}" -gt "${LOC_THRESHOLD}" ]; then LOC_OVER=true; fi
          FILES_OVER=false
          if [ "${FILES}" -gt "${FILE_THRESHOLD}" ]; then FILES_OVER=true; fi
          OVER=false
          if [ "${LOC_OVER}" = true ] || [ "${FILES_OVER}" = true ]; then OVER=true; fi

          {
            echo "loc=${LOC}"
            echo "files=${FILES}"
            echo "over_threshold=${OVER}"
          } >> "${GITHUB_OUTPUT}"
          echo "PR (excluding generated/vendored) changes ${LOC} lines across ${FILES} files; thresholds are ${LOC_THRESHOLD} lines / ${FILE_THRESHOLD} files."

          # Build the sticky-comment body here so the opening line and the
          # "what this checks" block can name the dimension(s) that actually
          # tripped. Shared header, reasons, and footer are written once; only
          # the lead clause and the diagnosis vary. Skip the work when under.
          [ "${OVER}" = true ] || exit 0

          if [ "${LOC_OVER}" = true ] && [ "${FILES_OVER}" = true ]; then
            LEAD="past both size limits the org flags on (**${LOC_THRESHOLD} lines and ${FILE_THRESHOLD} files**)"
            WHAT="this PR is both large and spread across many files — the combination that most often means several jobs got bundled into one. Is this really one change?"
          elif [ "${LOC_OVER}" = true ]; then
            LEAD="more than the size where the org flags a PR (**${LOC_THRESHOLD} lines changed**)"
            WHAT="this is a lot of changed code in one PR. Is it one big change, or several smaller ones stacked together?"
          else
            LEAD="touches more files than the org flags for a closer look (**${FILE_THRESHOLD} files**)"
            WHAT="this PR changes a lot of files across the project. Are those changes all part of the same job, or several unrelated ones bundled together?"
          fi

          {
            echo "message<<PR_SIZE_MSG_EOF"
            cat <<EOF
          ### Large PR — size check (non-blocking)

          This PR changes **${LOC} lines across ${FILES} files**, ${LEAD}. You can still merge it — this is just a heads-up so you can make sure the size is on purpose.

          **What this checks:** ${WHAT} A cleanup, a bug fix, and a new feature each belong in their own PR. If this one does more than one of those, split it up — one PR per job.

          **Why big PRs get flagged:**
          - If a bug turns up later, it's harder to track down — it could be anywhere in the ${LOC} lines. A smaller PR narrows it down fast.
          - The more a PR changes, the easier it is for a small mistake to slip through review unnoticed.

          **When a big PR is fine:** rewriting a single file, adding one self-contained module, or files that are generated automatically (like lockfiles or build output). If your change really is one job, you don't need to make it smaller — just double-check that it is one.

          More on how we size and split PRs: [Spice Eng Cookbook — Pull requests](https://github.com/SpiceLabsHQ/Eng-Cookbook/blob/main/standards/pull-requests.md).
          EOF
            echo "PR_SIZE_MSG_EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Post sticky size warning
        if: steps.size.outputs.over_threshold == 'true'
        # Belt-and-suspenders for the non-blocking guarantee. The job's intent
        # is awareness only, so a transient failure of the sticky-comment
        # action (network blip, GitHub API hiccup, secondary rate limit) must
        # not turn this into a red X. `continue-on-error: true` keeps the step
        # outcome visible in the logs but lets the job exit 0 regardless.
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: pr-hygiene-size
          message: ${{ steps.size.outputs.message }}

      # Clear the warning if a force-push trimmed the PR back below threshold.
      - name: Clear sticky size warning
        if: steps.size.outputs.over_threshold == 'false'
        # See note on the post step: the non-blocking guarantee must hold even
        # if the comment-delete call transiently fails.
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: pr-hygiene-size
          delete: true
