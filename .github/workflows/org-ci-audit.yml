name: Org CI Audit

# Scheduled CI floor & maturity audit (DEV-499). Runs scripts/org-ci-audit.sh
# across the org and upserts the resulting dashboard into a single pinned issue
# in this repo. Guidance (Silver/Gold next rungs) is surfaced there rather than
# as merge-blocking policy.
#
# TOKEN SETUP (one-time): the repo's default GITHUB_TOKEN is scoped to this repo
# only and cannot read other repos' contents or the org custom-property values.
# We mint a short-lived org-scoped installation token at runtime from a GitHub
# App (org-owned "SpiceLabsHQ CI Floor Audit"), so there is no long-lived PAT to
# rotate. The App is granted, org-wide:
#       Repository: Contents = read, Metadata = read, Issues = read/write
#       Organization: Custom properties = read
# Store the App's credentials as two secrets on THIS repo:
#       ORG_CI_AUDIT_APP_CLIENT_ID    = the App's Client ID
#       ORG_CI_AUDIT_APP_PRIVATE_KEY  = the App's private-key .pem contents
# Until those secrets exist the workflow no-ops with a warning (no red schedule).

on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: org-ci-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Inventory & publish dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Guard on App credentials presence
        id: guard
        env:
          APP_CLIENT_ID: ${{ secrets.ORG_CI_AUDIT_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.ORG_CI_AUDIT_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APP_CLIENT_ID}" ] || [ -z "${APP_KEY}" ]; then
            echo "::warning::ORG_CI_AUDIT_APP_CLIENT_ID / ORG_CI_AUDIT_APP_PRIVATE_KEY are not set — skipping the org CI audit. See this workflow's header for the one-time setup."
            echo "ok=false" >> "${GITHUB_OUTPUT}"
          else
            echo "ok=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Mint org-scoped installation token
        id: app-token
        if: steps.guard.outputs.ok == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ORG_CI_AUDIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORG_CI_AUDIT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run audit
        if: steps.guard.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          bash scripts/org-ci-audit.sh --org "${GITHUB_REPOSITORY_OWNER}" > dashboard.md
          echo "Generated dashboard ($(wc -l < dashboard.md) lines)."

      - name: Upsert & pin dashboard issue
        if: steps.guard.outputs.ok == 'true'
        env:
          # Issues write goes to THIS repo; the minted token carries that scope.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          TITLE: "CI Floor & Maturity Dashboard"
        run: |
          set -euo pipefail
          body="$(cat dashboard.md)"
          # Find an existing open issue with the exact title.
          num="$(gh issue list --repo "${REPO}" --state open --search "in:title \"${TITLE}\"" \
                   --json number,title --jq ".[] | select(.title==\"${TITLE}\") | .number" | head -1)"
          if [ -n "${num}" ]; then
            gh issue edit "${num}" --repo "${REPO}" --body "${body}"
            echo "Updated dashboard issue #${num}."
          else
            url="$(gh issue create --repo "${REPO}" --title "${TITLE}" --body "${body}")"
            num="${url##*/}"
            echo "Created dashboard issue ${url}."
            # Pin it (GraphQL; ignore failure if already at the 3-pin limit).
            iid="$(gh api "repos/${REPO}/issues/${num}" --jq '.node_id')"
            gh api graphql -f query='mutation($id:ID!){pinIssue(input:{issueId:$id}){issue{number}}}' \
              -f id="${iid}" >/dev/null 2>&1 && echo "Pinned #${num}." || echo "::notice::Could not auto-pin (pin limit?); pin #${num} manually."
          fi
