name: Secret Scan (reusable)

# Reusable Gitleaks scanner with two modes:
#
#   - pr-diff       (fast)  — scan only the commits a PR adds. Findings are
#                             surfaced in the job summary and FAIL the check so
#                             a leak can't merge. Use on every `pull_request`.
#   - full-history  (slow)  — scan the entire git history. Use on push to the
#                             default branch and on a weekly cron to catch
#                             secrets that slipped past pr-diff (e.g., in a
#                             squash-merge across many commits, or in a repo
#                             that adopted scanning after the leak landed).
#
# Why both? PR-diff scanning is intentionally narrow — it only sees the new
# commits — so a secret that was committed to a branch, then "fixed" by a
# follow-up commit, would never show up in pr-diff but is still in the history
# forever. The full-history pass is the safety net.
#
# Trigger model: this workflow ONLY runs via `workflow_call`. The caller wires
# it to `pull_request`, `push`, and `schedule` events and selects the mode for
# each. See `examples/caller-secret-scan.yml`.
#
# Engine: this drives the open-source `gitleaks` CLI directly (MIT-licensed,
# free for everyone including organization accounts). We deliberately do NOT
# use `gitleaks/gitleaks-action@v2`, which requires a paid `GITLEAKS_LICENSE`
# for repos under an organization account. The CLI runs the exact same
# detection engine with no license, no per-repo secret, and no procurement.
# See DEV-404.
#
# Security-tab integration: on PUBLIC repos, findings are uploaded as SARIF to
# GitHub code scanning (the Security tab) — this is free for public repos. On
# private/internal repos that step is auto-skipped, because code scanning there
# requires GitHub Advanced Security (a paid add-on); the scan still runs and
# still fails the check, you just don't get the Security-tab UI. The upload is
# `continue-on-error` so a caller that hasn't yet granted `security-events:
# write` degrades gracefully instead of failing the scan.
#
# Pinning policy: the gitleaks CLI is pinned to a release version
# (GITLEAKS_VERSION below) and the downloaded binary is verified against the
# release's published checksums before use. First-party actions
# (`actions/checkout`, GitHub's `upload-sarif`) are pinned to their major tag
# per the rest of this stack.

on:
  workflow_call:
    inputs:
      mode:
        description: |
          Scan mode. `pr-diff` scans only the commits added by the PR (fast,
          fails the check on a finding). `full-history` scans the entire git
          history (slow, used on push to default branch and weekly cron).
        required: false
        type: string
        default: pr-diff
      config_path:
        description: |
          Path (relative to the calling repo) to a Gitleaks config file with
          custom rules and allowlists. Tolerated absent — Gitleaks falls back
          to its built-in default ruleset.
        required: false
        type: string
        default: .gitleaks.toml
    # No secrets. The previous `GITLEAKS_LICENSE` secret is gone — the CLI does
    # not need it. Callers using `secrets: inherit` are unaffected.

# No top-level `permissions:` block — permissions are INHERITED from the calling
# job. This is deliberate: a reusable workflow that *declares* a scope the caller
# did not grant fails at startup (before any step runs), which would break every
# existing caller that grants only `contents: read` (+ `pull-requests: write`).
# By inheriting instead, we get:
#   - `contents: read`        — every caller grants this; needed for checkout.
#   - `security-events: write` — OPTIONAL. Only callers that grant it (see the
#     example) get the SARIF upload to the Security tab on public repos. Callers
#     without it still scan and still fail the check; the upload step simply
#     no-ops via continue-on-error. The upload is also gated to public repos.

# `github.workflow` is the CALLER's workflow name, and it is load-bearing here
# (DEV-1181). A repo can legitimately be covered by two callers at once: the
# ruleset-injected floor caller (`CI Floor — secret scan`) and its own
# `secret-scan.yml`, which the floor does not replace because the floor runs on
# pull_request only while a repo caller also wires push and schedule for
# full-history. Without the caller in the key both land in the SAME group with
# the same mode on the same PR, and `cancel-in-progress` makes whichever starts
# second cancel the first.
#
# When the loser is the floor run — the REQUIRED check — the PR is blocked with
# a CANCELLED status and no failure to read, and it stays blocked until a
# re-trigger happens to win the race. Observed on SpiceLabsHQ/KG-Power-BI, where
# it blocked two unrelated PRs and presented as an unexplained
# `Validate inputs` failure.
concurrency:
  group: secret-scan-${{ github.workflow }}-${{ inputs.mode }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pinned gitleaks CLI release. Bump deliberately; the download is verified
  # against this release's published checksums.txt, so there is no separate
  # hash to maintain here.
  GITLEAKS_VERSION: "8.30.1"

jobs:
  validate-mode:
    # Reject unknown `mode` values up front so a typo in the caller doesn't
    # silently skip both real jobs (each gates on `mode == '<expected>'`,
    # which would just no-op for an unknown value).
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "${MODE}" in
            pr-diff|full-history)
              echo "mode = ${MODE}"
              ;;
            *)
              echo "::error::Invalid mode '${MODE}'. Must be 'pr-diff' or 'full-history'."
              exit 1
              ;;
          esac

  pr-diff:
    name: Gitleaks (pr-diff)
    if: inputs.mode == 'pr-diff'
    needs: validate-mode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v7
        with:
          # gitleaks needs both the PR head and the merge base to scan the
          # range. Depth 0 is the simplest way to guarantee both are present.
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        env:
          VERSION: ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${tarball}" "${base}/${tarball}"
          curl -fsSL -o checksums.txt "${base}/gitleaks_${VERSION}_checksums.txt"
          # Verify the downloaded tarball against the release's published checksum.
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Resolve Gitleaks config
        id: cfg
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          set -euo pipefail
          if [ -n "${CONFIG_PATH}" ] && [ -f "${CONFIG_PATH}" ]; then
            echo "Using caller-provided Gitleaks config at ${CONFIG_PATH}"
            echo "path=${CONFIG_PATH}" >> "${GITHUB_OUTPUT}"
          else
            echo "No config at '${CONFIG_PATH}' — Gitleaks will use its built-in default ruleset."
            echo "path=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Determine repo visibility
        id: vis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          vis="$(gh api "repos/${REPO}" --jq .visibility)"
          echo "visibility=${vis}" >> "${GITHUB_OUTPUT}"
          echo "Repo visibility: ${vis}"

      - name: Run Gitleaks (PR diff)
        id: scan
        env:
          CFG_PATH: ${{ steps.cfg.outputs.path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Scan only the commits this PR adds (merge-base..head).
          args=()
          if [ -n "${CFG_PATH}" ]; then args+=( "--config=${CFG_PATH}" ); fi
          set +e
          gitleaks detect \
            --source . \
            --redact \
            --report-format sarif \
            --report-path results.sarif \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            "${args[@]}"
          code=$?
          set -e
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          echo "gitleaks exit code: ${code}"

      - name: Upload SARIF to code scanning (public repos only)
        # Code scanning is free on public repos; on private/internal it needs
        # GitHub Advanced Security, so we skip it there. continue-on-error keeps
        # a missing `security-events: write` permission from failing the scan.
        if: always() && steps.vis.outputs.visibility == 'public' && hashFiles('results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

      - name: Summarize and enforce
        if: always()
        env:
          CODE: ${{ steps.scan.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ "${CODE}" = "0" ]; then
            echo "### ✅ Secret Scan (pr-diff): no leaks found" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          {
            echo "### 🛑 Secret Scan (pr-diff): potential secrets detected"
            echo ""
            echo "gitleaks flagged one or more findings in the PR's new commits."
            echo "Secrets are redacted in the logs. Review the run, rotate any real"
            echo "credential, and remove it from the diff (and history if needed)."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error::Secret Scan failed — see the job summary."
          exit 1

  full-history:
    name: Gitleaks (full-history)
    if: inputs.mode == 'full-history'
    needs: validate-mode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo (full history)
        uses: actions/checkout@v7
        with:
          # Required for a full-history scan; without it the runner gets a
          # shallow clone and gitleaks only sees the most recent commit.
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        env:
          VERSION: ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${tarball}" "${base}/${tarball}"
          curl -fsSL -o checksums.txt "${base}/gitleaks_${VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Resolve Gitleaks config
        id: cfg
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          set -euo pipefail
          if [ -n "${CONFIG_PATH}" ] && [ -f "${CONFIG_PATH}" ]; then
            echo "Using caller-provided Gitleaks config at ${CONFIG_PATH}"
            echo "path=${CONFIG_PATH}" >> "${GITHUB_OUTPUT}"
          else
            echo "No config at '${CONFIG_PATH}' — Gitleaks will use its built-in default ruleset."
            echo "path=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Determine repo visibility
        id: vis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          vis="$(gh api "repos/${REPO}" --jq .visibility)"
          echo "visibility=${vis}" >> "${GITHUB_OUTPUT}"
          echo "Repo visibility: ${vis}"

      - name: Run Gitleaks (full history)
        id: scan
        env:
          CFG_PATH: ${{ steps.cfg.outputs.path }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${CFG_PATH}" ]; then args+=( "--config=${CFG_PATH}" ); fi
          set +e
          gitleaks detect \
            --source . \
            --redact \
            --report-format sarif \
            --report-path results.sarif \
            "${args[@]}"
          code=$?
          set -e
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          echo "gitleaks exit code: ${code}"

      - name: Upload SARIF to code scanning (public repos only)
        if: always() && steps.vis.outputs.visibility == 'public' && hashFiles('results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

      - name: Summarize and enforce
        if: always()
        env:
          CODE: ${{ steps.scan.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ "${CODE}" = "0" ]; then
            echo "### ✅ Secret Scan (full-history): no leaks found" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          {
            echo "### 🛑 Secret Scan (full-history): potential secrets detected"
            echo ""
            echo "gitleaks flagged one or more findings in the repository history."
            echo "Secrets are redacted in the logs. Review the run, rotate any real"
            echo "credential, and purge it from history."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error::Secret Scan failed — see the job summary."
          exit 1
