name: Secret Scan (reusable)

# Reusable Gitleaks scanner with two modes:
#
#   - pr-diff       (fast)  — scan only the lines a PR adds/changes. Findings
#                             post as inline review comments on the PR. Use on
#                             every `pull_request` so authors get feedback in
#                             seconds, not minutes.
#   - full-history  (slow)  — scan the entire git history. Use on push to the
#                             default branch and on a weekly cron to catch
#                             secrets that slipped past pr-diff (e.g., in a
#                             squash-merge across many commits, or in a repo
#                             that adopted scanning after the leak landed).
#
# Why both? PR-diff scanning is intentionally narrow — it only sees the diff —
# so a secret that was committed to a branch, then "fixed" by a follow-up
# commit, would never show up in pr-diff but is still in the history forever.
# The full-history pass is the safety net.
#
# Trigger model: this workflow ONLY runs via `workflow_call`. The caller wires
# it to `pull_request`, `push`, and `schedule` events and selects the mode for
# each. See `examples/caller-secret-scan.yml`.
#
# Permissions:
#   contents: read         — checkout the caller repo.
#   pull-requests: write   — gitleaks-action posts inline review comments on
#                             findings during pr-diff scans. Without this the
#                             action falls back to a job-summary-only report.
#   security-events: write is NOT requested — gitleaks-action does not produce
#   SARIF on the default code-path, so the SARIF upload permission would be
#   unused.
#
# Pinning policy: third-party actions are pinned to a 40-char commit SHA with
# the human-readable tag in a trailing comment. First-party `actions/checkout`
# is pinned to its major tag (`@v4`) per the rest of this stack.
#
# Licensing note: `gitleaks/gitleaks-action@v2` requires `GITLEAKS_LICENSE` for
# repos under an *organization* account; personal-account repos do not. The
# license is plumbed through as an OPTIONAL caller secret. If absent and the
# repo is under an org, the action fails fast with a clear message — that is
# the correct behavior (do not silently no-op a secret scanner).

on:
  workflow_call:
    inputs:
      mode:
        description: |
          Scan mode. `pr-diff` scans only the changed lines in the PR (fast,
          posts inline review comments). `full-history` scans the entire git
          history (slow, used on push to default branch and weekly cron).
        required: false
        type: string
        default: pr-diff
      config_path:
        description: |
          Path (relative to the calling repo) to a Gitleaks config file with
          custom rules and allowlists. Tolerated absent — Gitleaks falls back
          to its built-in default ruleset.
        required: false
        type: string
        default: .gitleaks.toml
    secrets:
      GITLEAKS_LICENSE:
        description: |
          Gitleaks Pro license key. Required by gitleaks-action v2 for repos
          under an organization account; not required for personal-account
          repos. Leave unset to let the action fail with its own diagnostic if
          your repo is under an org and you have not yet acquired a key.
        required: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: secret-scan-${{ inputs.mode }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-mode:
    # Reject unknown `mode` values up front so a typo in the caller doesn't
    # silently skip both real jobs (each gates on `mode == '<expected>'`,
    # which would just no-op for an unknown value).
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "${MODE}" in
            pr-diff|full-history)
              echo "mode = ${MODE}"
              ;;
            *)
              echo "::error::Invalid mode '${MODE}'. Must be 'pr-diff' or 'full-history'."
              exit 1
              ;;
          esac

  pr-diff:
    name: Gitleaks (pr-diff)
    if: inputs.mode == 'pr-diff'
    needs: validate-mode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          # gitleaks-action needs both the PR head and the merge base to
          # compute the diff. Depth 0 is overkill for PR-diff scans but is
          # the simplest way to guarantee the merge base is fetched without
          # juggling refs manually; the perf cost on PR-sized fetches is
          # negligible compared to the scan itself.
          fetch-depth: 0

      - name: Resolve Gitleaks config
        id: cfg
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          set -euo pipefail
          if [ -n "${CONFIG_PATH}" ] && [ -f "${CONFIG_PATH}" ]; then
            echo "Using caller-provided Gitleaks config at ${CONFIG_PATH}"
            echo "path=${CONFIG_PATH}" >> "${GITHUB_OUTPUT}"
          else
            echo "No config at '${CONFIG_PATH}' — Gitleaks will use its built-in default ruleset."
            echo "path=" >> "${GITHUB_OUTPUT}"
          fi

      # gitleaks-action keys its mode off `github.event_name`. When this
      # reusable workflow is invoked from a caller `pull_request` job, that
      # event name propagates through `workflow_call`, so the action sees
      # `pull_request` and runs its diff-only path with inline PR comments.
      # No event override is needed.
      - name: Run Gitleaks (PR diff)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass the license through only if the caller provided one. An
          # empty string is fine for personal-account repos; org repos
          # without a license will get a clear error from the action itself.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Empty -> action falls back to repo-root auto-detection, then to
          # built-in defaults. Setting to a non-existent path would error,
          # which is why the resolve step blanks it out when absent.
          GITLEAKS_CONFIG: ${{ steps.cfg.outputs.path }}
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

  full-history:
    name: Gitleaks (full-history)
    if: inputs.mode == 'full-history'
    needs: validate-mode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo (full history)
        uses: actions/checkout@v4
        with:
          # Required for a full-history scan; without it the runner gets a
          # shallow clone and Gitleaks reports "no commits to scan" or only
          # the most recent commit, defeating the purpose of this mode.
          fetch-depth: 0

      - name: Resolve Gitleaks config
        id: cfg
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          set -euo pipefail
          if [ -n "${CONFIG_PATH}" ] && [ -f "${CONFIG_PATH}" ]; then
            echo "Using caller-provided Gitleaks config at ${CONFIG_PATH}"
            echo "path=${CONFIG_PATH}" >> "${GITHUB_OUTPUT}"
          else
            echo "No config at '${CONFIG_PATH}' — Gitleaks will use its built-in default ruleset."
            echo "path=" >> "${GITHUB_OUTPUT}"
          fi

      # On `push` and `schedule`, gitleaks-action runs `gitleaks detect`
      # against the full repo (subject to fetch-depth above). PR commenting
      # is automatically disabled because there's no PR context.
      - name: Run Gitleaks (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: ${{ steps.cfg.outputs.path }}
          GITLEAKS_ENABLE_SUMMARY: "true"
