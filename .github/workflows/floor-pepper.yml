name: CI Floor — Pepper review

# Central CODE-floor workflow (DEV-499). Referenced by `spice-ci-floor-code` via
# the "require workflows to pass" rule; runs Pepper (Bedrock) on every PR in
# untagged (code-tier) repos with zero per-repo install. This is what
# guarantees review automation exists wherever bots open PRs — the fix for the
# stranded-Dependabot/Renovate PRs in DEV-497.
#
# `synchronize` is deliberately in the trigger list: every Renovate rebase
# force-pushes the PR branch, and without `synchronize` the review would never
# re-run (the DEV-497 root cause). Cost note: one Bedrock run per PR event
# org-wide is accepted (DEV-499).
#
# Secrets are org-level (visibility=all), so no per-repo secret setup is
# required — but visibility is not the whole story. GitHub keeps TWO org secret
# stores, and a Dependabot-triggered run is served only from the Dependabot one:
# every `secrets.*` reference to an Actions-scoped secret interpolates to an
# empty string, whatever its visibility. So each secret below must exist in BOTH
# stores to survive a Dependabot PR. Pepper failed on every genuinely
# Dependabot-triggered run for months because the App private key existed only
# under Actions — the token step died on the empty value and, this being a
# required check, the PR could not be merged by any means (DEV-797). It looked
# intermittent only because the DEV-667 stranded-PR sweep reopens such PRs as
# the Pepper App, which re-fires the event as a non-Dependabot actor and
# restores the Actions store. Any new secret added here needs the same
# treatment.
#
# `PEPPER_PR_REVIEW_APP_ID` is now inert — the App's Client ID moved to the
# reusable's `app_client_id` input (a Client ID is public, not a credential), so
# nothing reads this secret any more. It is still passed on purpose: this caller
# pins the reusable at `@pepper-pr-review-v1`, and this file reaches every repo
# the moment it lands on main, while the tag only moves at the next release.
# Between those two points the tagged reusable still declares the secret
# `required: true`, and a caller that stopped passing it would fail EVERY floor
# run org-wide. Drop it only after the tag has moved past DEV-797.
#
# Bot handling: the reusable's `allowed_bots: renovate,dependabot` lets those
# bots' PRs be reviewed. Any other bot-initiated event skips the review cleanly
# inside the reusable's gate (DEV-504) — a skipped required job satisfies the
# ruleset and leaves any prior verdict intact. This caller additionally skips
# rosemary-releaser[bot] release PRs outright: there's nothing to review in a
# version bump, and a failure would deadlock the release loop.
#
# Do NOT add `pull_request_target` — see pepper-self-review.yml for the reason.

on:
  pull_request:
    # Only the default activity types — deliberately. GitHub delivers
    # ruleset-injected workflows on the DEFAULT pull_request types only; extra
    # declared types (ready_for_review) and other events (issue_comment) are
    # silently dropped (DEV-576), so declaring them here would be dead config
    # that reads like capability. Consequence: a draft marked ready gets its
    # review on the next push (synchronize). Comment-triggered runs are not
    # reachable anywhere, which is why on-demand mode was removed (DEV-876).
    types: [opened, synchronize, reopened]

jobs:
  pepper:
    if: >-
      github.repository != 'SpiceLabsHQ/.github' &&
      github.event.pull_request.user.login != 'rosemary-releaser[bot]'
    uses: SpiceLabsHQ/.github/.github/workflows/pepper-pr-review.yml@pepper-pr-review-v1
    with:
      # `pepper-pr-review` — Pepper's own App — is listed because of the
      # stranded-PR sweep (DEV-667). That sweep reopens stranded PRs as this App,
      # which makes it the triggering actor of the resulting `reopened` event;
      # without this entry the bot-initiator gate (DEV-504) would skip every
      # review the sweep fires — all the churn, none of the reviews, and silently,
      # since a skipped required check still passes. Removing it disables the
      # sweep with no signal, so the sweep asserts its own presence on this list
      # at startup and refuses to run otherwise.
      #
      # Reviewing and re-firing a missed review are two actions of ONE capability,
      # so they share one App: ADR-0007 scopes an App per capability, not per
      # workflow. This does NOT let Pepper review its own PRs; it opens none.
      allowed_bots: renovate,dependabot,pepper-pr-review
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
      issues: read
    secrets:
      AWS_CLAUDE_BEDROCK_ROLE_ARN: ${{ secrets.AWS_CLAUDE_BEDROCK_ROLE_ARN }}
      PEPPER_PR_REVIEW_APP_ID: ${{ secrets.PEPPER_PR_REVIEW_APP_ID }}
      PEPPER_PR_REVIEW_APP_PRIVATE_KEY: ${{ secrets.PEPPER_PR_REVIEW_APP_PRIVATE_KEY }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
