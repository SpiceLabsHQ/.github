name: Release Please (self)

# Self-hosted release management for SpiceLabsHQ/.github via the org-defaults
# release-please.yml reusable workflow at @v1.
#
# Authored by the Rosemary Releaser GitHub App so:
#   1. The release PR appears as `rosemary-releaser[bot]` (not the human who
#      pushed the merge commit), and
#   2. Tag pushes from this repo can fire downstream workflows in dependent
#      repos (the GITHUB_TOKEN tag-cascade suppression doesn't apply when the
#      tag is created by an installation token).
#
# Triggers on push to main. The reusable workflow is workflow_call only;
# this caller decides when to invoke it.

on:
  push:
    branches: [main]

# Permissions are declared on the calling job (required for reusable workflows
# — workflow-level permissions don't propagate into a `uses:` job). The
# permissions here must be a superset of what release-please.yml's job-level
# block declares.
jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    uses: SpiceLabsHQ/.github/.github/workflows/release-please.yml@v1
    secrets:
      ROSEMARY_RELEASER_APP_ID: ${{ secrets.ROSEMARY_RELEASER_APP_ID }}
      ROSEMARY_RELEASER_APP_PRIVATE_KEY: ${{ secrets.ROSEMARY_RELEASER_APP_PRIVATE_KEY }}
