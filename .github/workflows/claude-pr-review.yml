name: Claude PR Review (reusable)

# Security model — read before changing trigger handling:
#
# Callers MUST trigger this workflow only via `pull_request` and `issue_comment`.
# NEVER add `pull_request_target` to a caller. `pull_request_target` runs in the
# base repo's context with full secret access even for fork PRs, which would let
# an attacker exfiltrate secrets via a malicious diff or workflow file. The plain
# `pull_request` event is safe for forks because GitHub strips secrets
# automatically.
#
# `issue_comment` on a public PR can be triggered by any GitHub user, so the job
# guard below restricts it to OWNER / MEMBER / COLLABORATOR comment authors. Org
# 2FA is the second line of defense. Do not weaken either layer without a
# replacement.

on:
  workflow_call:
    inputs:
      model:
        description: Bedrock model ID or inference profile to use for review.
        required: false
        type: string
        default: us.anthropic.claude-sonnet-4-5-20250929-v1:0
      aws_region:
        description: AWS region where the Bedrock role and models live.
        required: false
        type: string
        default: us-west-2
      trigger_phrase:
        description: Comment phrase that triggers an on-demand run.
        required: false
        type: string
        default: "@claude"
      standards_path:
        description: Path (relative to the calling repo) to the optional review standards file.
        required: false
        type: string
        default: .claude/pr-review-standards.md
      default_reviewer:
        description: GitHub login to fall back to when no other collaborator qualifies for assignment.
        required: false
        type: string
        default: brodkin
      show_full_output:
        description: |
          When true, claude-code-action streams the full SDK output (tool calls, reasoning, tool results) into the
          Actions log. Useful for diagnosing permission denials, token waste, or unexpected outcomes. WARNING: log
          contents are visible to anyone with read access to Actions runs — on a public repo, that's everyone.
          Leave false in production; enable temporarily on a debug branch when you need to inspect tool calls.
        required: false
        type: boolean
        default: false
    secrets:
      AWS_CLAUDE_BEDROCK_ROLE_ARN:
        description: ARN of the AWS role to assume via OIDC for Bedrock access.
        required: true
      CLAUDE_REVIEW_APP_ID:
        description: GitHub App ID used to mint a token capable of formal PR approvals.
        required: true
      CLAUDE_REVIEW_APP_PRIVATE_KEY:
        description: Private key (PEM) for the GitHub App used for approvals.
        required: true
      LINEAR_API_KEY:
        description: Linear API key for issue verification. Optional; if absent, Linear checks are skipped.
        required: false

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read
  issues: read

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    # See "Security model" comment at top of file.
    # `issue_comment` is gated to org members so non-members can't trigger
    # secret-bearing runs by typing the trigger phrase on a public PR.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, inputs.trigger_phrase) &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                github.event.comment.author_association))
    steps:
      - name: Generate App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CLAUDE_REVIEW_APP_ID }}
          private-key: ${{ secrets.CLAUDE_REVIEW_APP_PRIVATE_KEY }}

      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # `issue_comment` events check out the default branch by default. For on-demand
      # mode (Claude making edits the user asked for) we need to be on the PR's head
      # branch so commits land on the right ref. Fork PRs aren't supported in
      # on-demand mode — the App token can't push to forks, and we don't want to
      # silently no-op.
      - name: Switch to PR head branch (on-demand mode only)
        if: github.event_name == 'issue_comment'
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          PR_JSON=$(gh pr view "${PR_NUMBER}" --json headRefName,headRepositoryOwner,isCrossRepository)
          HEAD_REF=$(echo "${PR_JSON}" | jq -r '.headRefName')
          IS_FORK=$(echo "${PR_JSON}" | jq -r '.isCrossRepository')
          if [ "${IS_FORK}" = "true" ]; then
            echo "::error::PR #${PR_NUMBER} is from a fork; on-demand mode is not supported for fork PRs (App token cannot push to forks)."
            exit 1
          fi
          git fetch origin "${HEAD_REF}":"${HEAD_REF}"
          git checkout "${HEAD_REF}"
          # Configure committer identity for any commits Claude pushes.
          # Look up the bot user's ID so commits link to the App's profile via the
          # standard `<id>+<login>@users.noreply.github.com` noreply format.
          BOT_LOGIN=$(gh api /user --jq '.login')
          BOT_ID=$(gh api /user --jq '.id')
          git config user.name "${BOT_LOGIN}"
          git config user.email "${BOT_ID}+${BOT_LOGIN}@users.noreply.github.com"
          echo "Switched to PR branch: ${HEAD_REF} (committer: ${BOT_LOGIN})"

      - name: Fetch review prompt template
        uses: actions/checkout@v4
        with:
          repository: SpiceLabsHQ/.github
          ref: ${{ github.workflow_sha }}
          path: .claude-review-tpl
          sparse-checkout: prompts
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Build review prompt
        id: prompt
        env:
          STANDARDS_PATH: ${{ inputs.standards_path }}
          DEFAULT_PROMPT_PATH: .claude-review-tpl/prompts/pr-review-default.md
          DEFAULT_REVIEWER: ${{ inputs.default_reviewer }}
          MARKER: "<!-- PROJECT_GUIDELINES_PLACEHOLDER -->"
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          if [ ! -f "${DEFAULT_PROMPT_PATH}" ]; then
            echo "Default prompt not found at ${DEFAULT_PROMPT_PATH}" >&2
            exit 1
          fi

          PROJECT_BLOCK="$(mktemp)"
          if [ -n "${STANDARDS_PATH}" ] && [ -f "${STANDARDS_PATH}" ]; then
            cat "${STANDARDS_PATH}" > "${PROJECT_BLOCK}"
          else
            echo "_None provided. Apply the organization defaults above._" > "${PROJECT_BLOCK}"
          fi

          ASSEMBLED="$(mktemp)"
          awk -v marker="${MARKER}" -v block_file="${PROJECT_BLOCK}" '
            $0 == marker {
              while ((getline line < block_file) > 0) print line
              close(block_file)
              next
            }
            { print }
          ' "${DEFAULT_PROMPT_PATH}" > "${ASSEMBLED}"

          # Substitute the default reviewer placeholder.
          # Use a sentinel-safe delimiter; default_reviewer is a GitHub login (no slashes/special chars).
          sed -i "s|{{DEFAULT_REVIEWER}}|${DEFAULT_REVIEWER}|g" "${ASSEMBLED}"

          # Build the runtime context block. The action does not give Claude an
          # explicit event_name, so without this it can't reliably distinguish
          # auto-review from on-demand and defaults to reviewing every PR.
          RUNTIME_CONTEXT="$(mktemp)"
          {
            echo "<runtime_context>"
            echo "<triggering_event>${EVENT_NAME}</triggering_event>"
            if [ "${EVENT_NAME}" = "issue_comment" ]; then
              echo "<task_from_comment>"
              # Strip the trigger phrase so Claude reads only the actual ask.
              echo "${COMMENT_BODY}"
              echo "</task_from_comment>"
            fi
            echo "</runtime_context>"
            echo ""
          } > "${RUNTIME_CONTEXT}"

          {
            echo 'prompt<<CLAUDE_PROMPT_EOF'
            cat "${RUNTIME_CONTEXT}" "${ASSEMBLED}"
            echo 'CLAUDE_PROMPT_EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Determine allowed tools for this run
        id: tools
        run: |
          set -euo pipefail
          # Auto-review (pull_request) is read-only on the filesystem.
          # On-demand (issue_comment) opens edit/write/push capabilities.
          AUTO_TOOLS='Bash(gh *),Bash(git log:*),Bash(git diff:*),Bash(git blame:*),Bash(git show:*),Bash(curl *)'
          ON_DEMAND_TOOLS='Edit,Write,Bash'
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "allowed=${ON_DEMAND_TOOLS}" >> "${GITHUB_OUTPUT}"
          else
            echo "allowed=${AUTO_TOOLS}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Configure AWS credentials (Bedrock OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CLAUDE_BEDROCK_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: claude-pr-review-${{ github.run_id }}

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_bedrock: "true"
          trigger_phrase: ${{ inputs.trigger_phrase }}
          additional_permissions: |
            actions: read
          show_full_output: ${{ inputs.show_full_output }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          # `model` and `--allowedTools` aren't top-level inputs on
          # claude-code-action@v1; they go through `claude_args` (CLI flags
          # passed to the underlying Claude Code SDK). Without these,
          # the action silently uses defaults, which results in permission
          # denials when Claude tries to run gh / git / curl from the prompt.
          claude_args: >-
            --model ${{ inputs.model }}
            --allowedTools "${{ steps.tools.outputs.allowed }}"
