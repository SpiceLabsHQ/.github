name: Renovate preset — detection and rewrite tests

# Runs the fixture suites for scripts/lib/renovate-preset.sh — the shared
# library behind both the audit that REPORTS preset adoption (DEV-1153) and the
# sweep that FIXES it (DEV-1167). One library, so one workflow.
#
# It matters because both failure modes are silent:
#   - detection regressing is a false GREEN: before DEV-1153 the audit scored
#     Renovate on file presence alone, so nine repos inheriting no org policy —
#     no auto-merge, no release-age soak, no vulnerabilityAlerts carve-out for
#     CVE fixes — read as compliant for six weeks (DEV-1150).
#   - the rewrite regressing edits a file in 20+ repos unattended. Dropping
#     `enabledManagers` there would silently enable npm on repos whose engines
#     floor is unsettled (DEV-1103).
#
# Neither fails loudly on its own, so they are pinned down here.

on:
  pull_request:
    paths:
      - "scripts/lib/renovate-preset.sh"
      - "scripts/org-ci-audit.sh"
      - "scripts/sweep-renovate-preset.sh"
      - ".github/workflows/test/org-ci-audit-renovate-test.sh"
      - ".github/workflows/test/renovate-sweep-rewrite-test.sh"
      - ".github/workflows/org-ci-audit-renovate-test.yml"
      # The rewrite suite reads pr-hygiene's allowed-type list rather than
      # restating it, so a change there must re-run these fixtures.
      - ".github/workflows/pr-hygiene.yml"

permissions:
  contents: read

jobs:
  fixtures:
    name: Renovate preset library fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preset detection fixtures
        run: .github/workflows/test/org-ci-audit-renovate-test.sh
      - name: Config rewrite fixtures
        run: .github/workflows/test/renovate-sweep-rewrite-test.sh
