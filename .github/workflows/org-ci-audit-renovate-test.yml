name: Org CI audit — Renovate preset detection test

# Runs the fixture tests for the audit's Renovate preset detection (DEV-1153)
# on any PR that touches the audit script or the test, so the on-preset vs
# off-preset distinction stays pinned down in CI.
#
# It matters because the failure mode is a false GREEN: before DEV-1153 the
# audit scored Renovate on file presence alone, so nine repos inheriting no org
# dependency policy — no auto-merge, no release-age soak, and no
# vulnerabilityAlerts carve-out for CVE fixes — read as compliant for six weeks
# (DEV-1150). A regression here does not fail loudly; it just stops reporting.

on:
  pull_request:
    paths:
      - "scripts/org-ci-audit.sh"
      - ".github/workflows/test/org-ci-audit-renovate-test.sh"
      - ".github/workflows/org-ci-audit-renovate-test.yml"

permissions:
  contents: read

jobs:
  fixtures:
    name: Renovate preset detection fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run Renovate preset detection fixture tests
        run: .github/workflows/test/org-ci-audit-renovate-test.sh
