name: Repo Checks

# Repo-local CI for invariants that only this repo's own files can violate.
#
# `Versioning integrity` — the versioning invariants that per-workflow
# release-please routing depends on. Fails the PR when:
#
#   * a reusable workflow — or a file it ships, such as pepper-pr-review's
#     prompts/ templates — is in THIS PR's diff and no file under
#     workflows/<name>/ is. release-please assigns commits to packages by
#     directory path prefix, and the PR's file list is the squash commit's file
#     list, so such a commit would reach no package: no release PR, no changelog
#     entry, no tag, and consumers pinned to the moving tag alias keep the old
#     behavior. Regenerating workflows/<name>/workflow.sha256 is how a human
#     satisfies this.
#   * a reusable workflow is in THIS PR's diff and workflows/<name>/pins.yml no
#     longer says what the generator would write from it (DEV-1314). That file
#     is the mirror Renovate bumps so an action bump lands inside the package
#     directory and cuts a release; a ref or version key missing from it means
#     the next bump of that ref touches only the workflow YAML, reaches no
#     package, and strands every consumer on the moving tag alias. A MISSING
#     pins.yml only warns — that is merely the pre-mirror world, whose
#     consequence the routing assertion above already catches on the bot PR.
#   * a package dir is orphaned (workflow renamed/deleted without cleanup)
#   * release-please-config.json / .release-please-manifest.json don't match
#     the reusable-workflow inventory 1:1
#
# The first two assertions are scoped to the diff (DEV-1311, DEV-1314). The
# whole-repo checksum comparison the first replaced tested a proxy — nothing
# ever reads the hash — and put every open PR at the mercy of drift a merged bot
# PR had left on main, which once turned this check red repo-wide for work
# touching none of it (DEV-726). The pins assertion is diff-scoped for exactly
# that reason and must stay that way. The last two stay whole-repo because no
# per-PR diff can express them.
#
# Fix locally with: scripts/sync-workflow-checksums.sh
#
# `Bot allowlist drift` — the bot inventory duplicated across pepper-pr-review,
# floor-pepper and floor-automerge (DEV-679). Actions has no cross-workflow
# literal sharing, so the duplication stays and agreement is asserted instead.
# Repo-local rather than part of the scheduled org-ci-audit because all three
# files live here, the check needs no token and no network, and divergence is
# introduced by a PR in this repo — so the signal belongs on that PR, before the
# merge, not in a dashboard a week later.
#
# Check locally with: scripts/check-bot-allowlists.sh

on:
  pull_request:

permissions:
  contents: read

jobs:
  versioning-integrity:
    name: Versioning integrity
    runs-on: ubuntu-latest
    steps:
      # actions/checkout — first-party, allowed to use a major-version tag.
      # fetch-depth: 0 because the gate is diff-scoped: the default shallow
      # checkout of the merge ref carries no base branch, and so no merge base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The fixtures run first and in this same job: they cost about a second,
      # they need no extra runner, and a routing verdict from a checker whose
      # own logic is broken is not worth reading. Same reasoning as the
      # bot-allowlists job below — this checker already runs on every PR, so
      # there is nothing for a separate path-filtered `*-test.yml` to add.
      - name: Run routing-invariant fixtures
        run: scripts/test/sync-workflow-checksums_test.sh

      - name: Check release routing for the workflows this PR touches
        env:
          # Via env, not a `${{ }}` interpolation in the script body: a branch
          # name is attacker-controlled text.
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # fetch-depth: 0 makes actions/checkout fetch
          # +refs/heads/*:refs/remotes/origin/*, so origin/$BASE_REF is normally
          # already here — but verify rather than assume, and fetch it when it
          # is not. An unresolvable base would leave `git diff` with nothing to
          # report, and a routing check fed an empty file list is a check that
          # passes because it looked at nothing. The script hard-errors on an
          # empty list for the same reason; the two guards are deliberate.
          # The fallback fetch is anonymous — persist-credentials: false above
          # drops the checkout's token — which is fine on a public repo.
          if ! git rev-parse --verify --quiet "refs/remotes/origin/${BASE_REF}" >/dev/null; then
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          fi
          # Three dots: the diff against the MERGE BASE, which is exactly the
          # file list the squash commit will carry, and exactly what
          # release-please routes on. The two flags are what make that
          # literally true, and both close a fail-OPEN gap — do not drop them:
          #
          #   --no-renames        git's rename detection reports only the
          #                       destination path, so moving a shipped asset
          #                       out of prompts/ would hide the source path
          #                       the routing rule matches on. Off, a rename is
          #                       the delete plus the add, which is also how
          #                       release-please sees the commit.
          #   core.quotePath=false  otherwise a non-ASCII path arrives
          #                       C-quoted ("prompts/caf\303\251.md"), matching
          #                       neither prompts/*.md nor workflows/<name>/*.
          #
          # Written to a file rather than piped, so a `git diff` failure stops
          # the step here instead of feeding the checker an empty list and
          # printing a green verdict just above the red step.
          git -c core.quotePath=false diff --no-renames --name-only \
            "origin/${BASE_REF}...HEAD" >"${RUNNER_TEMP}/changed-files.txt"
          scripts/sync-workflow-checksums.sh --check-routing \
            <"${RUNNER_TEMP}/changed-files.txt"

      # A SEPARATE step, reading the SAME diff the step above already wrote
      # (DEV-1314). Two reasons it is not folded into --check-routing:
      #
      #   * Different questions. Routing asks "does this diff reach the package
      #     directory?"; this asks "does the generated mirror still match the
      #     workflow it mirrors?" A change can pass one and fail the other, and
      #     the two failures want different fixes, so they get different steps
      #     and different verdicts.
      #   * --check-routing needs no yq and no pins file, and keeping it that
      #     way is deliberate. --check-pins needs yq (preinstalled on
      #     ubuntu-latest, same assumption the bot-allowlists job makes).
      #
      # Still diff-scoped, never whole-repo: a pins.yml already stale on main for
      # a workflow this PR never touched is invisible here. Whole-repo drift
      # failing unrelated PRs is DEV-726, which DEV-1311 removed from this job.
      #
      # A MISSING pins.yml only warns, so this step is inert until the migration
      # commits the twelve files.
      - name: Check pins files agree for the workflows this PR touches
        run: |
          set -euo pipefail
          scripts/sync-workflow-checksums.sh --check-pins \
            <"${RUNNER_TEMP}/changed-files.txt"

  bot-allowlists:
    name: Bot allowlist drift
    runs-on: ubuntu-latest
    steps:
      # actions/checkout — first-party, allowed to use a major-version tag.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The fixtures run first and in this same job: they cost about a second,
      # they need no extra runner, and a drift verdict from a checker whose own
      # logic is broken is not worth reading. This is why there is no separate
      # path-filtered `*-test.yml` here — repo-settings-plan-test.yml and
      # pepper-stranded-sweep-test.yml exist because the logic they cover runs
      # only on a schedule and would otherwise have no pre-merge signal at all.
      # This checker already runs on every PR.
      #
      # yq (mikefarah v4) and jq are both preinstalled on ubuntu-latest; the
      # same assumption already backs scripts/org-repo-settings-reconcile.sh.
      - name: Run allowlist drift fixtures
        run: scripts/test/check-bot-allowlists_test.sh

      - name: Check bot allowlists for drift
        run: scripts/check-bot-allowlists.sh
