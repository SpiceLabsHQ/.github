name: Pepper — stranded PR sweep

# The GUARANTEE half of the floor's draft handling (DEV-667). Pairs with the
# draft-only nag comment (DEV-666), which is the fast path; this is the net.
#
# THE GAP: GitHub delivers ruleset-injected workflows on the DEFAULT
# pull_request activity types only, so nothing in the floor can see
# `ready_for_review` (DEV-576). A PR opened as a draft and later marked ready
# therefore gets no review until something re-fires an event the floor CAN see —
# in practice, the author happening to push another commit. DEV-465 is the same
# class: a new PR reusing a branch already reviewed at that SHA.
#
# THE FIX: sweep the org on a low cadence for open, non-draft PRs with no current
# Pepper verdict, and reopen each one (close -> reopen) to re-fire the injected
# floor review against the SAME head SHA. That is the workaround people already
# do by hand, automated. All the decision logic lives in
# scripts/pepper-stranded-sweep.sh; the per-PR rules are a standalone jq program
# with fixture tests (pepper-stranded-sweep-test.yml), because this workflow only
# ever runs on a schedule and a defect here would surface as churn, not a red PR.
#
# IDENTITY — the non-obvious constraint. The reopen makes the acting App the
# TRIGGERING ACTOR of the resulting pull_request event, and the reusable's
# bot-initiator gate (DEV-504) skips any bot initiator outside `allowed_bots`. So
# floor-pepper.yml carries this sweep's App in its `allowed_bots`. Those two facts
# are load-bearing for each other and changing either alone breaks the sweep
# SILENTLY (reopens happen, reviews never do, nothing goes red) — so the script
# asserts its own presence on that list at startup and refuses to run otherwise.
#
# The sweep acts as Pepper's own App (`pepper-pr-review`). Reviewing a PR and
# re-firing a review that never happened are two actions of ONE capability, so
# they share one App — ADR-0007 scopes an App per capability, not per workflow,
# and this is not a second capability borrowing a first one's credentials. One
# login then answers both questions the sweep asks ("has Pepper reviewed?" and
# "did we already nudge?"), which is sound precisely because nothing else in
# Pepper reopens PRs: a reopen by this App is the sweep.
#
# GUARDRAILS (all three are in the script, exercised by the fixture test):
#   - Per-run cap (`max_nudges`, default 5) so a mass-stranding event cannot fire
#     a burst of Bedrock-billed reviews. The next run mops up the rest.
#   - No re-nudge: a PR already nudged with no review since is left alone, so a
#     non-responding floor can never become a reopen loop.
#   - Floor exclusions inherited: drafts, docs-tier repos, this `.github` repo,
#     and rosemary-releaser release PRs.
#
# ONE-TIME SETUP: grant the existing `pepper-pr-review` App one more permission,
# org-wide. It already holds what the close -> reopen needs:
#       Repository:   Pull requests     = read/write   (already granted)
#       Repository:   Metadata          = read         (already granted)
#       Organization: Custom properties = read         (ADD THIS — docs-tier skip)
# The credentials are the App's existing `PEPPER_PR_REVIEW_APP_*` org secrets, so
# there is nothing new to store. Until they resolve, the workflow no-ops with a
# warning rather than failing.
#
# Without the custom-property read the run FAILS rather than proceeding: an
# unreadable property list is indistinguishable from "no repo is docs-tier",
# which would put every docs repo in scope and reopen PRs there that no floor
# review will ever answer. Fail-closed is the cheap direction here.

on:
  schedule:
    # Every ~15 min, deliberately OFF the quarter-hour marks. GitHub documents
    # that the `schedule` event "can be delayed during periods of high loads",
    # that "high load times include the start of every hour", and that under
    # sufficient load "some queued jobs may be dropped" — with the recommended
    # mitigation being to schedule at a different time of the hour. `*/15` fires
    # at :00 (the documented worst slot) plus three other round minutes every
    # repo reaches for; in practice it produced zero runs in the first hour after
    # this workflow shipped. These offsets match the convention already used by
    # the other schedules here (`37 6`, `17 13`, `41 6`).
    # 5 minutes is the documented floor, so the cadence itself was never the
    # problem — the minute-of-hour was.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      max_nudges:
        description: "Max PRs to nudge in this run (per-run cap)."
        required: false
        type: string
        default: "5"
      dry_run:
        description: "Report what would be nudged without closing/reopening anything."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel a run in flight. The sweep's one destructive window is between
# `gh pr close` and `gh pr reopen`; a cancellation landing there would leave a
# contributor's PR closed. Overlapping runs are prevented by queueing instead,
# which also stops two runs from double-nudging the same PR.
concurrency:
  group: pepper-stranded-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Find & nudge stranded PRs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Only the private key is checked. The App's identity is no longer a secret
      # — it moved to a literal Client ID below (DEV-797) — so the key is the
      # only thing that can be absent.
      - name: Guard on App credentials presence
        id: guard
        env:
          APP_KEY: ${{ secrets.PEPPER_PR_REVIEW_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APP_KEY}" ]; then
            echo "::warning::PEPPER_PR_REVIEW_APP_PRIVATE_KEY is not set — skipping the sweep. See this workflow's header for the one-time App setup."
            echo "ok=false" >> "${GITHUB_OUTPUT}"
          else
            echo "ok=true" >> "${GITHUB_OUTPUT}"
          fi

      # `owner:` widens the installation token from this repo to the whole org —
      # the sweep reads PRs everywhere and reopens them in place.
      - name: Mint org-scoped installation token
        id: app-token
        if: steps.guard.outputs.ok == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # Client ID of the `pepper-pr-review` App, superseding the deprecated
          # `app-id` (DEV-797). A literal, not a secret: a Client ID is a public
          # identifier and only the private key is a credential. Actions has no
          # cross-workflow literal sharing, so this duplicates the
          # `app_client_id` default in pepper-pr-review.yml — same App, and the
          # two must be changed together.
          client-id: Iv23limzNKGGfg5MOKxm
          private-key: ${{ secrets.PEPPER_PR_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Sweep
        if: steps.guard.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Resolved from the token we actually minted rather than hardcoded, so
          # a rename of the App cannot desync the "has Pepper reviewed / did we
          # already nudge" tests from the login we really act as. The startup
          # preflight checks this same resolved slug against floor-pepper.yml's
          # allowed_bots.
          PEPPER_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          MAX_NUDGES: ${{ inputs.max_nudges || '5' }}
        run: |
          set -euo pipefail
          args=(--org "${GITHUB_REPOSITORY_OWNER}" --max "${MAX_NUDGES}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          bash scripts/pepper-stranded-sweep.sh "${args[@]}"
