name: Pepper PR Review (reusable)

# Security model — read before changing trigger handling:
#
# Callers MUST trigger this workflow only via `pull_request` and `issue_comment`.
# NEVER add `pull_request_target` to a caller. `pull_request_target` runs in the
# base repo's context with full secret access even for fork PRs, which would let
# an attacker exfiltrate secrets via a malicious diff or workflow file. The plain
# `pull_request` event is safe for forks because GitHub strips secrets
# automatically.
#
# `issue_comment` on a public PR can be triggered by any GitHub user, so the job
# guard below restricts it to OWNER / MEMBER / COLLABORATOR comment authors. Org
# 2FA is the second line of defense. Do not weaken either layer without a
# replacement.

on:
  workflow_call:
    inputs:
      model:
        description: |
          Override the model used for both review and on-demand. When set, this wins over `review_model`
          and `on_demand_model`. Leave empty to keep per-mode defaults, which carry cost-allocation tags
          (Product=pepper, Mode=review|on-demand) — overriding here forfeits that attribution.
        required: false
        type: string
        default: ""
      review_model:
        description: |
          Model used in review mode (auto-triggered on pull_request, or `@pepper review` comment).
          Defaults to the `pepper-pr-review-sonnet-5` Application Inference Profile, tagged
          Mode=review for AWS cost allocation. The profile wraps the `us.anthropic.claude-sonnet-5`
          cross-region inference profile (DEV-492; Application Inference Profiles are immutable, so
          a model upgrade means a new profile ARN here, not an edit to the old one).
        required: false
        type: string
        default: arn:aws:bedrock:us-west-2:618640261060:application-inference-profile/xda66yqkegz4
      on_demand_model:
        description: |
          Model used in on-demand mode (`@pepper <task>` comments with edit/write/push tools).
          Defaults to the `pepper-on-demand-sonnet-5` Application Inference Profile, tagged
          Mode=on-demand for AWS cost allocation. Same underlying Claude Sonnet 5 as review mode;
          tagged separately so we can see which flow drives spend.
        required: false
        type: string
        default: arn:aws:bedrock:us-west-2:618640261060:application-inference-profile/lk2br1cu7fkj
      aws_region:
        description: AWS region where the Bedrock role and models live.
        required: false
        type: string
        default: us-west-2
      trigger_phrase:
        description: Comment phrase that triggers an on-demand run.
        required: false
        type: string
        default: "@pepper"
      standards_path:
        description: Path (relative to the calling repo) to the optional review standards file.
        required: false
        type: string
        default: .pepper/pr-review-standards.md
      default_reviewer:
        description: GitHub login to fall back to when no other collaborator qualifies for assignment.
        required: false
        type: string
        default: brodkin
      show_full_output:
        description: |
          When true, claude-code-action streams the full SDK output (tool calls, reasoning, tool results) into the
          Actions log. Useful for diagnosing permission denials, token waste, or unexpected outcomes. WARNING: log
          contents are visible to anyone with read access to Actions runs — on a public repo, that's everyone.
          Leave false in production; enable temporarily on a debug branch when you need to inspect tool calls.
        required: false
        type: boolean
        default: false
    secrets:
      AWS_CLAUDE_BEDROCK_ROLE_ARN:
        description: ARN of the AWS role to assume via OIDC for Bedrock access.
        required: true
      PEPPER_PR_REVIEW_APP_ID:
        description: GitHub App ID used to mint a token capable of formal PR approvals.
        required: true
      PEPPER_PR_REVIEW_APP_PRIVATE_KEY:
        description: Private key (PEM) for the GitHub App used for approvals.
        required: true
      LINEAR_API_KEY:
        description: Linear API key for issue verification. Optional; if absent, Linear checks are skipped.
        required: false

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read
  issues: read

concurrency:
  group: pepper-pr-review-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  review:
    name: Pepper review
    runs-on: ubuntu-latest
    # See "Security model" comment at top of file.
    # `issue_comment` is gated to org members so non-members can't trigger
    # secret-bearing runs by typing the trigger phrase on a public PR.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, inputs.trigger_phrase) &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                github.event.comment.author_association))
    steps:
      - name: Generate App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PEPPER_PR_REVIEW_APP_ID }}
          private-key: ${{ secrets.PEPPER_PR_REVIEW_APP_PRIVATE_KEY }}

      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # `pull_request` always means review. `issue_comment` splits by body:
      # `@pepper review` (or whatever trigger_phrase is) followed by the word
      # `review` routes to the review prompt with read-only tools; anything
      # else routes to on-demand mode with edit/write/push tools. Keeping the
      # split here means downstream steps stay branch-free on event_name.
      - name: Determine mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
        run: |
          set -euo pipefail
          MODE="on-demand"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            MODE="review"
          elif [ "${EVENT_NAME}" = "issue_comment" ]; then
            NORMALIZED=$(printf '%s' "${COMMENT_BODY}" | tr -s '[:space:]' ' ' | tr '[:upper:]' '[:lower:]')
            TRIGGER_LOWER=$(printf '%s' "${TRIGGER_PHRASE}" | tr '[:upper:]' '[:lower:]')
            case "${NORMALIZED}" in
              *"${TRIGGER_LOWER} review"*) MODE="review" ;;
            esac
          fi
          echo "Resolved mode: ${MODE}"
          echo "mode=${MODE}" >> "${GITHUB_OUTPUT}"

      # `gh pr edit --add-label "<name>"` errors with `"<name>" not found`
      # when the label doesn't exist in the repo — gh does not auto-create
      # labels on add. Pre-create the four labels Pepper applies so every
      # downstream `--add-label`/`--remove-label` resolves cleanly,
      # including the very first review in a fresh consumer repo.
      # `gh label create` errors when a label already exists; the `|| true`
      # makes the call a no-op so we don't clobber per-repo customization
      # of color or description on existing labels.
      - name: Ensure Pepper labels exist (review mode only)
        if: steps.mode.outputs.mode == 'review'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create "pepper-cooking"           --repo "${REPO}" --color "B87333" --description "Pepper is currently reviewing this PR" 2>/dev/null || true
          gh label create "pepper-approved"          --repo "${REPO}" --color "0E8A16" --description "Pepper approved this PR" 2>/dev/null || true
          gh label create "pepper-changes-requested" --repo "${REPO}" --color "D93F0B" --description "Pepper requested changes" 2>/dev/null || true
          gh label create "pepper-needs-review"      --repo "${REPO}" --color "FBCA04" --description "Pepper needs human review" 2>/dev/null || true

      # Mark this PR as under active Pepper review and clear any prior
      # outcome labels in a single API call. The remove side is gated on
      # labels actually being on the PR — `gh pr edit --remove-label`
      # errors if a label doesn't exist in the repo at all (cold-start
      # case for a fresh repo's first review). Pepper's final action
      # swaps `pepper-cooking` for the chosen outcome label, and the
      # always-on cleanup at the end of the job removes the marker if
      # Pepper never finished. Net: `pepper-cooking` only appears on a
      # PR that is currently being reviewed, never as a stale leftover.
      - name: Mark PR as cooking (review mode only)
        if: steps.mode.outputs.mode == 'review'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          # Build the gh-pr-edit argv as a single array so we never expand
          # an empty array under `set -u` (bash 3.2 / 4.3 footgun: empty
          # `"${arr[@]}"` errors as unbound variable). ARGS always carries
          # the --add-label pair, so the expansion is always safe.
          CURRENT=$(gh pr view "${PR_NUMBER}" --json labels --jq '[.labels[].name] | join(",")')
          ARGS=(--add-label "pepper-cooking")
          for label in pepper-approved pepper-changes-requested pepper-needs-review; do
            case ",${CURRENT}," in
              *,"${label}",*) ARGS+=(--remove-label "${label}") ;;
            esac
          done
          gh pr edit "${PR_NUMBER}" "${ARGS[@]}"

      # `issue_comment` events check out the default branch by default. For on-demand
      # mode (Pepper making edits the user asked for) we need to be on the PR's head
      # branch so commits land on the right ref. Fork PRs aren't supported in
      # on-demand mode — the App token can't push to forks, and we don't want to
      # silently no-op.
      #
      # Gated on resolved mode rather than event name so a `@pepper review`
      # comment on a fork PR isn't blocked by the fork-fail below — review mode
      # doesn't need branch switching at all (it reads the diff via gh).
      - name: Switch to PR head branch (on-demand mode only)
        if: steps.mode.outputs.mode == 'on-demand'
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # The action's app-slug output is the App's URL slug. If a future
          # minor of actions/create-github-app-token drops the output (or this
          # workflow is called via an older pin), fall back to a hardcoded slug
          # for the SpiceLabsHQ App.
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          PR_JSON=$(gh pr view "${PR_NUMBER}" --json headRefName,headRepositoryOwner,isCrossRepository)
          HEAD_REF=$(echo "${PR_JSON}" | jq -r '.headRefName')
          IS_FORK=$(echo "${PR_JSON}" | jq -r '.isCrossRepository')
          if [ "${IS_FORK}" = "true" ]; then
            echo "::error::PR #${PR_NUMBER} is from a fork; on-demand mode is not supported for fork PRs (App token cannot push to forks)."
            exit 1
          fi
          git fetch origin "${HEAD_REF}":"${HEAD_REF}"
          git checkout "${HEAD_REF}"

          if [ -z "${APP_SLUG}" ]; then
            echo "::error::actions/create-github-app-token did not produce app-slug. Pin to a newer minor of the action that exposes it."
            exit 1
          fi
          BOT_LOGIN="${APP_SLUG}[bot]"
          # Public users endpoint, accessible to install tokens. Brackets URL-encoded.
          BOT_USER_ID=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq '.id')
          git config user.name "${BOT_LOGIN}"
          git config user.email "${BOT_USER_ID}+${BOT_LOGIN}@users.noreply.github.com"
          echo "Switched to PR branch: ${HEAD_REF} (committer: ${BOT_LOGIN})"

      - name: Fetch review prompt template
        # Pin to the v1 tag rather than ${{ github.workflow_sha }}. When this
        # reusable workflow is called from a PR in the SAME repo, workflow_sha
        # resolves to the PR head SHA, not the v1 tag's SHA — so prompt updates
        # land in main but stale PR branches keep using their own (old) copy.
        # Always tracking v1 means the latest prompt is used for every review.
        uses: actions/checkout@v4
        with:
          repository: SpiceLabsHQ/.github
          ref: refs/tags/v1
          path: .pepper-pr-review-tpl
          sparse-checkout: prompts
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Build prompt
        id: prompt
        env:
          STANDARDS_PATH: ${{ inputs.standards_path }}
          DEFAULT_REVIEWER: ${{ inputs.default_reviewer }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          GUIDELINES_MARKER: "<!-- PROJECT_GUIDELINES_PLACEHOLDER -->"
          TASK_MARKER: "<!-- TASK_PLACEHOLDER -->"
          MODE: ${{ steps.mode.outputs.mode }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          # Pick the right template for the resolved mode. Each mode has its
          # own purpose-built prompt — sharing a prompt led to the model picking
          # the wrong mode and either reviewing on-demand requests or trying to
          # edit during auto-review.
          case "${MODE}" in
            review)
              TEMPLATE=".pepper-pr-review-tpl/prompts/pr-review-default.md"
              ;;
            on-demand)
              TEMPLATE=".pepper-pr-review-tpl/prompts/on-demand-default.md"
              ;;
            *)
              echo "Unsupported mode: ${MODE}" >&2
              exit 1
              ;;
          esac

          if [ ! -f "${TEMPLATE}" ]; then
            echo "Prompt template not found at ${TEMPLATE}" >&2
            exit 1
          fi

          PROJECT_BLOCK="$(mktemp)"
          if [ -n "${STANDARDS_PATH}" ] && [ -f "${STANDARDS_PATH}" ]; then
            cat "${STANDARDS_PATH}" > "${PROJECT_BLOCK}"
          else
            echo "_None provided. Apply the defaults above._" > "${PROJECT_BLOCK}"
          fi

          # Substitute the project guidelines block (both templates have it).
          ASSEMBLED="$(mktemp)"
          awk -v marker="${GUIDELINES_MARKER}" -v block_file="${PROJECT_BLOCK}" '
            $0 == marker {
              while ((getline line < block_file) > 0) print line
              close(block_file)
              next
            }
            { print }
          ' "${TEMPLATE}" > "${ASSEMBLED}"

          # For on-demand, substitute the user's comment in for the task placeholder.
          if [ "${MODE}" = "on-demand" ]; then
            TASK_FILE="$(mktemp)"
            printf '%s\n' "${COMMENT_BODY}" > "${TASK_FILE}"
            ASSEMBLED2="$(mktemp)"
            awk -v marker="${TASK_MARKER}" -v block_file="${TASK_FILE}" '
              $0 == marker {
                while ((getline line < block_file) > 0) print line
                close(block_file)
                next
              }
              { print }
            ' "${ASSEMBLED}" > "${ASSEMBLED2}"
            mv "${ASSEMBLED2}" "${ASSEMBLED}"
          fi

          # Substitute scalar placeholders. default_reviewer is a GitHub login,
          # PR_NUMBER is a positive integer — neither contains characters that
          # would need escaping for sed's replacement.
          sed -i "s|{{DEFAULT_REVIEWER}}|${DEFAULT_REVIEWER}|g" "${ASSEMBLED}"
          sed -i "s|{{PR_NUMBER}}|${PR_NUMBER}|g" "${ASSEMBLED}"

          {
            echo 'prompt<<PEPPER_PROMPT_EOF'
            cat "${ASSEMBLED}"
            echo 'PEPPER_PROMPT_EOF'
          } >> "${GITHUB_OUTPUT}"

      # Pick the model identifier the SDK will pass to Bedrock. Per-mode
      # defaults are AWS Application Inference Profiles tagged for cost
      # allocation (Product=pepper, Mode=review|on-demand) so AWS Cost
      # Explorer can attribute spend by flow. The `model` input is an
      # explicit override that wins for both modes — useful for testing a
      # different model on a debug branch, but it forfeits the per-mode
      # cost attribution because override values bypass the tagged profiles.
      - name: Resolve model for this run
        id: model
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          OVERRIDE: ${{ inputs.model }}
          REVIEW_MODEL: ${{ inputs.review_model }}
          ON_DEMAND_MODEL: ${{ inputs.on_demand_model }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE}" ]; then
            RESOLVED="${OVERRIDE}"
            echo "Using override model (cost attribution disabled): ${RESOLVED}"
          elif [ "${MODE}" = "review" ]; then
            RESOLVED="${REVIEW_MODEL}"
            echo "Using review-mode profile: ${RESOLVED}"
          else
            RESOLVED="${ON_DEMAND_MODEL}"
            echo "Using on-demand-mode profile: ${RESOLVED}"
          fi
          echo "model=${RESOLVED}" >> "${GITHUB_OUTPUT}"

      - name: Determine allowed tools for this run
        id: tools
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          # Review mode is read-only on the filesystem (auto-review on
          # pull_request, or `@pepper review` comment on a PR).
          # On-demand mode opens edit/write/push capabilities.
          AUTO_TOOLS='Bash(gh *),Bash(git log:*),Bash(git diff:*),Bash(git blame:*),Bash(git show:*),Bash(curl *)'
          # Linear MCP read-only tools. The hosted Linear MCP exposes more,
          # but the bot only needs issues/comments/teams/projects/users for
          # PR-review context. List read-only tools explicitly so a write
          # tool can never be invoked even if the API key is later upgraded.
          LINEAR_TOOLS='mcp__linear__get_issue,mcp__linear__list_issues,mcp__linear__list_comments,mcp__linear__get_team,mcp__linear__list_teams,mcp__linear__get_user,mcp__linear__list_users,mcp__linear__get_project,mcp__linear__list_projects,mcp__linear__list_issue_labels,mcp__linear__get_milestone,mcp__linear__list_milestones,mcp__linear__get_initiative,mcp__linear__list_initiatives'
          ON_DEMAND_TOOLS='Edit,Write,Bash'
          if [ "${MODE}" = "on-demand" ]; then
            echo "allowed=${ON_DEMAND_TOOLS}" >> "${GITHUB_OUTPUT}"
          else
            echo "allowed=${AUTO_TOOLS},${LINEAR_TOOLS}" >> "${GITHUB_OUTPUT}"
          fi

      # Wire up Linear's hosted MCP server when LINEAR_API_KEY is set. The
      # action consumes this via `--mcp-config <path>` in claude_args. The bot
      # then has read-only access to Linear via mcp__linear__* tools, which
      # supports graph traversal (sub-issues, parents, related, comments)
      # without the bot needing to write GraphQL or auth headers itself.
      # Runs for any review-mode invocation (pull_request or `@pepper review`
      # comment) so re-reviews get the same Linear context as auto-review.
      - name: Build MCP config (review mode only)
        id: mcp
        if: steps.mode.outputs.mode == 'review'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${LINEAR_API_KEY:-}" ]; then
            echo "No LINEAR_API_KEY — skipping MCP config (Linear access disabled for this run)"
            echo "path=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          MCP_FILE="$(mktemp --suffix=.json)"
          jq -nc --arg key "${LINEAR_API_KEY}" '{
            mcpServers: {
              linear: {
                type: "http",
                url: "https://mcp.linear.app/mcp",
                headers: { Authorization: ("Bearer " + $key) }
              }
            }
          }' > "${MCP_FILE}"
          echo "path=${MCP_FILE}" >> "${GITHUB_OUTPUT}"
          echo "Wrote MCP config to ${MCP_FILE} (Linear server enabled)"

      - name: Configure AWS credentials (Bedrock OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CLAUDE_BEDROCK_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: pepper-pr-review-${{ github.run_id }}

      - name: Run Pepper
        uses: anthropics/claude-code-action@v1
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_bedrock: "true"
          trigger_phrase: ${{ inputs.trigger_phrase }}
          additional_permissions: |
            actions: read
          show_full_output: ${{ inputs.show_full_output }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          # `model` and `--allowedTools` aren't top-level inputs on
          # claude-code-action@v1; they go through `claude_args` (CLI flags
          # passed to the underlying Claude Code SDK). Without these,
          # the action silently uses defaults, which results in permission
          # denials when Pepper tries to run gh / git / curl from the prompt.
          claude_args: >-
            --model ${{ steps.model.outputs.model }}
            --allowedTools "${{ steps.tools.outputs.allowed }}"
            ${{ steps.mcp.outputs.path != '' && format('--mcp-config {0}', steps.mcp.outputs.path) || '' }}

      # Always-on cleanup — `pepper-cooking` is purely a "currently being
      # reviewed" marker, so it must come off no matter how this job ended
      # (Pepper success, Pepper failure, prompt-build error, AWS-creds
      # error, runner timeout, manual cancellation). Failed runs are
      # surfaced via the workflow's run status; we don't need a stale
      # label to encode the same signal. The check-before-remove handles
      # the corner case where the cooking step itself failed and the
      # label is not in the repo (would otherwise error on --remove-label).
      - name: Clear pepper-cooking marker
        if: always() && steps.mode.outputs.mode == 'review'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -uo pipefail
          if gh pr view "${PR_NUMBER}" --json labels --jq '.labels[].name' 2>/dev/null | grep -Fxq "pepper-cooking"; then
            gh pr edit "${PR_NUMBER}" --remove-label "pepper-cooking"
          fi
