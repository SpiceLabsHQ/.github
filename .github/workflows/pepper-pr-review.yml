name: Pepper PR Review (reusable)

# Security model — read before changing trigger handling:
#
# Callers MUST trigger this workflow only via `pull_request` and `issue_comment`.
# NEVER add `pull_request_target` to a caller. `pull_request_target` runs in the
# base repo's context with full secret access even for fork PRs, which would let
# an attacker exfiltrate secrets via a malicious diff or workflow file. The plain
# `pull_request` event is safe for forks because GitHub strips secrets
# automatically.
#
# `issue_comment` on a public PR can be triggered by any GitHub user, so the job
# guard below restricts it to OWNER / MEMBER / COLLABORATOR comment authors. Org
# 2FA is the second line of defense. Do not weaken either layer without a
# replacement.

on:
  workflow_call:
    inputs:
      model:
        description: |
          Override the model used for both review and on-demand. When set, this wins over `review_model`
          and `on_demand_model`. Leave empty to keep per-mode defaults, which carry cost-allocation tags
          (Product=pepper, Mode=review|on-demand) — overriding here forfeits that attribution.
        required: false
        type: string
        default: ""
      review_model:
        description: |
          Model used in review mode (auto-triggered on pull_request, or `@pepper review` comment).
          Defaults to the `pepper-pr-review-sonnet-5` Application Inference Profile, tagged
          Mode=review for AWS cost allocation. The profile wraps the `us.anthropic.claude-sonnet-5`
          cross-region inference profile (DEV-492; Application Inference Profiles are immutable, so
          a model upgrade means a new profile ARN here, not an edit to the old one).
        required: false
        type: string
        default: arn:aws:bedrock:us-west-2:618640261060:application-inference-profile/xda66yqkegz4
      on_demand_model:
        description: |
          Model used in on-demand mode (`@pepper <task>` comments with edit/write/push tools).
          Defaults to the `pepper-on-demand-sonnet-5` Application Inference Profile, tagged
          Mode=on-demand for AWS cost allocation. Same underlying Claude Sonnet 5 as review mode;
          tagged separately so we can see which flow drives spend.
        required: false
        type: string
        default: arn:aws:bedrock:us-west-2:618640261060:application-inference-profile/lk2br1cu7fkj
      aws_region:
        description: AWS region where the Bedrock role and models live.
        required: false
        type: string
        default: us-west-2
      trigger_phrase:
        description: Comment phrase that triggers an on-demand run.
        required: false
        type: string
        default: "@pepper"
      standards_path:
        description: Path (relative to the calling repo) to the optional review standards file.
        required: false
        type: string
        default: .pepper/pr-review-standards.md
      reviewers_team:
        description: |
          Slug of the org team Pepper requests review from when it escalates (cannot approve or request
          changes with high confidence). Must be a team in the repo's own org with at least read access
          to the repo. The App token needs org `members: read` to resolve the team.
        required: false
        type: string
        default: reviewers
      show_full_output:
        description: |
          When true, claude-code-action streams the full SDK output (tool calls, reasoning, tool results) into the
          Actions log. Useful for diagnosing permission denials, token waste, or unexpected outcomes. WARNING: log
          contents are visible to anyone with read access to Actions runs — on a public repo, that's everyone.
          Leave false in production; enable temporarily on a debug branch when you need to inspect tool calls.
        required: false
        type: boolean
        default: false
      allowed_bots:
        description: |
          Comma-separated bot logins (without the `[bot]` suffix) whose PRs Pepper
          reviews and whose events may trigger a review. Any OTHER bot initiator on
          a pull_request event is skipped by the `gate` job (DEV-504) instead of
          hard-failing claude-code-action. Single source of truth for both the gate
          job and the action's own `allowed_bots` parameter below.
        required: false
        type: string
        default: renovate,dependabot
      coverage_review_enabled:
        description: |
          Opt in to the DEV-526 diff-coverage note. OFF by default so a repo that does not publish coverage
          pays nothing — no poll and no added review latency. Turn it on ONLY in repos that add the
          `coverage-surface` step to their test job (they upload `coverage_artifact`); leaving it off for
          everyone else keeps Pepper reviewing immediately as before. When off, the poll and note steps are
          skipped entirely; the review prompt still carries the (inert) coverage-signal guidance, which the
          model is told to ignore when no note is present, so Pepper reviews off the diff exactly as before.
        required: false
        type: boolean
        default: false
      coverage_artifact:
        description: |
          Name of the artifact carrying a repo's coverage file (DEV-526). When `coverage_review_enabled` is on,
          the job polls for this artifact by the PR head SHA, runs `diff-cover` against the base, and folds a NON-GATING
          diff-coverage note into the review prompt. Must match the `artifact-name` on the `coverage-surface`
          composite action the repo adds to its test job. A repo that never uploads it falls back cleanly
          (Pepper reviews off the diff as today). No coverage number ever gates the merge — the note only
          informs the reviewer's judgment (ADR-0004).
        required: false
        type: string
        default: coverage-report
      coverage_poll_timeout_seconds:
        description: |
          Absolute ceiling on how long the review job waits for the coverage artifact. The wait is a SHELL
          poll — no inference is running yet, so this is build minutes, not model time (tests are the longest
          CI task, so Pepper must not hard-`needs:` them). The poll also gives up early once no CI run for the
          head SHA is still active, so repos that never emit coverage resolve fast instead of burning the
          full timeout.
        required: false
        type: number
        default: 1200
      coverage_poll_grace_seconds:
        description: |
          Minimum time to keep polling before the "no active CI runs" early-exit may fire. Gives sibling CI a
          moment to register after the PR event so the poll doesn't give up in the race window before tests
          have started.
        required: false
        type: number
        default: 45
      coverage_poll_interval_seconds:
        description: Seconds between coverage-artifact poll attempts.
        required: false
        type: number
        default: 15
      review_timeout_minutes:
        description: |
          Hard wall-clock cap (minutes) for the Run Pepper step — the SIGKILL
          backstop for a wedged run. `--max-turns` is the graceful primary stop;
          keep this sized above a healthy review's turns x per-invocation latency
          so max-turns, not this, is what normally stops a slow-but-healthy run.
          A consumer with a tighter latency budget can lower it. See DEV-534.
        required: false
        type: number
        default: 50
      review_budget_margin_minutes:
        description: |
          Minutes subtracted from `review_timeout_minutes` to form the budget
          advertised to the review prompt ({{REVIEW_BUDGET_MINUTES}}). The model
          cannot see a clock and the real stop is an ungraceful kill, so the
          advertised budget is deliberately short of the real cap — the margin
          covers the inference tail and the final file-verdict/label actions.
          DEV-534.
        required: false
        type: number
        default: 10
    secrets:
      AWS_CLAUDE_BEDROCK_ROLE_ARN:
        description: ARN of the AWS role to assume via OIDC for Bedrock access.
        required: true
      PEPPER_PR_REVIEW_APP_ID:
        description: GitHub App ID used to mint a token capable of formal PR approvals.
        required: true
      PEPPER_PR_REVIEW_APP_PRIVATE_KEY:
        description: Private key (PEM) for the GitHub App used for approvals.
        required: true
      LINEAR_API_KEY:
        description: Linear API key for issue verification. Optional; if absent, Linear checks are skipped.
        required: false

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read
  issues: read

concurrency:
  # Key by the CALLER's identity (github.workflow) in addition to the PR, so the
  # org ruleset's REQUIRED floor-pepper run and a repo's own Pepper caller never
  # share a group and can never evict each other (DEV-561).
  #
  # Why the old PR-only key stranded PRs even with cancel-in-progress: false —
  # GitHub keeps at most one in-progress AND one pending run per group; when a
  # third run enters, the currently PENDING one is cancelled. On a repo that has
  # both a local `Pepper PR Review` caller and the ruleset-injected floor-pepper,
  # a single PR event fires up to three runs into one PR-only group (the caller's
  # `opened` + `ready_for_review`, plus floor-pepper). One ran, one pended, and
  # the third evicted the pending one — a coin flip that repeatedly cancelled the
  # required floor-pepper run and left PRs BLOCKED with no auto-retry.
  #
  # In a reusable (workflow_call) workflow, github.workflow resolves to the
  # CALLER's top-level workflow name, so `CI Floor — Pepper review` (floor) and a
  # repo's `Pepper PR Review` caller get DISTINCT group keys and run in parallel
  # without cancelling one another. Runs from the SAME caller on one PR still
  # share a group and serialize (cancel-in-progress stays false), which the
  # DEV-523 unchanged-SHA short-circuit relies on to skip duplicate reviews.
  group: pepper-pr-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  # Bot-initiator gate (DEV-504). claude-code-action HARD-FAILS when the event's
  # triggering actor is a bot not in `allowed_bots` — even on a human-authored PR.
  # Observed: linear-code[bot] firing `ready_for_review` re-triggered Pepper and
  # failed it; because floor-pepper is a REQUIRED check org-wide, that failure
  # deadlocks auto-merge (DEV-502). This job decides whether the review should run
  # so a non-allowlisted bot initiator SKIPS the review cleanly (a skipped required
  # job satisfies the ruleset, and the PR author's prior review state is untouched)
  # instead of hard-failing. Human and allowlisted-bot initiators run as before.
  gate:
    name: Bot-initiator gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      nag: ${{ steps.decide.outputs.nag }}
    steps:
      # Minted only on pull_request events, where the decide step needs the
      # App's bot login ("<app-slug>[bot]") to pick Pepper's own prior reviews
      # out of the review list for the DEV-523 unchanged-SHA short-circuit.
      # issue_comment events never reach that branch, so no token is minted for
      # them. continue-on-error keeps a token-mint hiccup from FAILING the gate
      # (which would skip the review via `needs`): an empty app-slug just falls
      # through to run=true, and the review job mints its own token as before.
      - name: Generate App installation token
        id: app-token
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PEPPER_PR_REVIEW_APP_ID }}
          private-key: ${{ secrets.PEPPER_PR_REVIEW_APP_PRIVATE_KEY }}

      - name: Decide whether to run the review
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          ALLOWED_BOTS: ${{ inputs.allowed_bots }}
          # DEV-523 unchanged-SHA short-circuit. All empty on issue_comment
          # events (no pull_request payload / token not minted), where the
          # short-circuit deliberately does not apply.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          run=true
          # `nag` is the exact MIRROR of the draft skip below (DEV-666): the runs
          # where the review is skipped for being a draft post the draft-guidance
          # comment instead, and no others. It is set ONLY inside the live-draft
          # branch, which is itself reachable only while `run` is still true — so
          # a PR skipped for any OTHER reason (non-allowlisted bot initiator,
          # unchanged SHA) never gets the comment, and the fail-open path where
          # draft state is unreadable reviews rather than nags.
          nag=false
          # Only pull_request events carry the triggering actor that
          # claude-code-action gates on. If that actor is a bot NOT on the
          # allow-list, skip rather than let the action hard-fail.
          if [ "${EVENT_NAME}" = "pull_request" ] && printf '%s' "${ACTOR}" | grep -q '\[bot\]$'; then
            bot="${ACTOR%\[bot\]}"
            allowed=false
            IFS=',' read -ra _list <<< "${ALLOWED_BOTS}"
            for b in "${_list[@]:-}"; do
              b="$(printf '%s' "${b}" | tr -d '[:space:]')"
              [ -n "${b}" ] && [ "${b}" = "${bot}" ] && allowed=true
            done
            if [ "${allowed}" != true ]; then
              run=false
              echo "::notice::Triggering actor '${ACTOR}' is a non-allowlisted bot on a pull_request event — skipping Pepper review to avoid a hard-fail (DEV-504). The PR author's prior review state is unaffected."
            fi
          fi
          # Skip auto-review of draft PRs, judged from LIVE draft state rather
          # than the event payload. GitHub fires `opened` with draft:true at
          # creation, but the standard agent flow (`gh pr create --draft` then
          # `gh pr ready` a second later) makes that snapshot stale within
          # seconds. A run that trusted `github.event.pull_request.draft` skipped
          # a PR that was already ready and stranded it at REVIEW_REQUIRED with no
          # auto-retry (DEV-561 failure mode 2). Query the PR's current isDraft
          # instead. The caller's `ready_for_review` trigger and an explicit
          # `@pepper review` comment both still work; a skipped required check
          # satisfies branch protection, same as the bot-initiator skip above.
          # pull_request only (issue_comment carries no PR payload). Fail-open: if
          # isDraft can't be read (token hiccup / API error) we do NOT skip — a
          # wasted review on a true draft is cheap (DEV-523 short-circuits the
          # re-review) and far safer than wrongly skipping a ready PR. DEV-235.
          #
          # CAVEAT (DEV-576/DEV-645): "`ready_for_review` and `@pepper review`
          # both re-trigger" holds only for repos with a committed Pepper caller
          # (e.g. .github's pepper-self-review.yml). In ruleset-injected "floor"
          # repos GitHub honors only the default pull_request activity types
          # (opened, synchronize, reopened) and drops both `ready_for_review` and
          # `issue_comment` — there a new push (synchronize) is the only
          # re-trigger. User-facing text below points at pushing a commit so the
          # advice is correct on the floor too.
          if [ "${run}" = true ] && [ "${EVENT_NAME}" = "pull_request" ]; then
            LIVE_DRAFT=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json isDraft --jq '.isDraft' 2>/dev/null || true)
            if [ "${LIVE_DRAFT}" = "true" ]; then
              run=false
              nag=true
              echo "::notice::PR is a draft — skipping auto-review. Mark it ready for review, then push a commit to trigger a review. DEV-235."
            elif [ -z "${LIVE_DRAFT}" ]; then
              echo "::notice::Could not read live draft state for PR #${PR_NUMBER} — proceeding with review (fail-open; DEV-561)."
            fi
          fi
          # DEV-523 — short-circuit an automatic re-review when the PR head SHA
          # is unchanged since Pepper's last review. A pull_request re-trigger
          # (e.g. the author marking a draft ready-for-review) against a commit
          # Pepper already reviewed otherwise spends a full Bedrock-billed
          # invocation just to conclude "nothing new." That determination is
          # cheap and pre-model: compare the PR head SHA to the commit_id of
          # Pepper's most recent review on the PR. On a match we skip the whole
          # review job (a skipped required check still satisfies the ruleset),
          # leaving the existing verdict and label untouched — a no-op, not a
          # noise-adding "already reviewed" comment.
          #
          # pull_request only: an explicit `@pepper review` comment is a human
          # deliberately asking for a fresh pass, so it is never short-circuited
          # (issue_comment doesn't enter this block). NOTE (DEV-576/DEV-645):
          # that escape hatch exists only where issue_comment reaches Pepper —
          # not in ruleset-injected floor repos, which drop issue_comment. There
          # the only way past this short-circuit is a new commit (new SHA), so
          # the notice below advises pushing rather than commenting. The workflow's
          # `cancel-in-progress: false` concurrency group serializes runs per
          # PR, so a re-trigger fired while an earlier review is still in flight
          # waits for it to finish and post — by the time this runs, that
          # review's commit_id is visible and the duplicate is skipped (the
          # exact double-review case from DEV-518).
          #
          # Fail-open: any inability to identify the bot or read its last
          # reviewed commit leaves run=true, so at worst we run a review we
          # could have skipped — never skip one we should have run.
          if [ "${run}" = true ] && [ "${EVENT_NAME}" = "pull_request" ]; then
            if [ -z "${APP_SLUG}" ]; then
              echo "::notice::No app-slug from actions/create-github-app-token — cannot identify Pepper's reviews; running review (DEV-523 short-circuit skipped)."
            else
              BOT_LOGIN="${APP_SLUG}[bot]"
              # Stream "submitted_at commit_id" for every review Pepper authored,
              # across all pages (a per-element `select` is pagination-safe here,
              # unlike an aggregating filter such as `last`). Sort by the ISO-8601
              # timestamp (lexically ordered) and take the newest. `|| ...=""`
              # keeps a transient API failure fail-open under `set -euo pipefail`.
              LAST_REVIEWED_SHA=$(gh api --paginate \
                "repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100" \
                --jq ".[] | select(.user.login == \"${BOT_LOGIN}\") | \"\(.submitted_at) \(.commit_id)\"" \
                2>/dev/null | sort | tail -n1 | awk '{print $2}') || LAST_REVIEWED_SHA=""
              if [ -z "${LAST_REVIEWED_SHA}" ]; then
                echo "No prior Pepper review on PR #${PR_NUMBER} (or reviews unreadable) — running review."
              elif [ "${LAST_REVIEWED_SHA}" = "${HEAD_SHA}" ]; then
                run=false
                echo "::notice::Head SHA ${HEAD_SHA} was already reviewed by Pepper — skipping this automatic re-review (DEV-523). The existing verdict and label are left intact; push a new commit to get a fresh review."
              else
                echo "Head SHA ${HEAD_SHA} differs from Pepper's last-reviewed ${LAST_REVIEWED_SHA} — running review."
              fi
            fi
          fi
          echo "run=${run}" >> "${GITHUB_OUTPUT}"
          echo "nag=${nag}" >> "${GITHUB_OUTPUT}"

  # Draft guidance (DEV-666). The gate skips the review on drafts, which from
  # the PR surface is indistinguishable from "Pepper never ran" — the author is
  # left waiting for a review that will never arrive. This job is the mirror
  # image of that skip: draft -> say how to get reviewed, ready -> nothing (the
  # review runs as before). It is the FAST PATH of draft handling; the org sweep
  # is the guarantee half.
  #
  # A STICKY comment (same `header:` every run) so a draft pushed to ten times
  # carries one comment, updated in place, not ten. Cleared once the PR is no
  # longer a draft so a "still a draft" note never sits above Pepper's actual
  # verdict — the same post/clear pairing pr-hygiene uses for its size warning.
  #
  # NON-BLOCKING BY CONSTRUCTION. floor-pepper is a REQUIRED check org-wide, so
  # a failure here would deadlock auto-merge (DEV-502) over a courtesy comment.
  # Every step is `continue-on-error`, leaving the job green whatever GitHub's
  # comment API does.
  draft-guidance:
    name: Draft guidance comment
    needs: gate
    runs-on: ubuntu-latest
    # `nag` is only ever true on a pull_request event, so this covers both the
    # post and the clear branches without re-testing the event name.
    if: github.event_name == 'pull_request'
    steps:
      # Posted under Pepper's own identity — the message speaks in first person
      # about Pepper's review behavior, so github-actions[bot] would be the
      # wrong voice. continue-on-error + the `||` fallback below mean a mint
      # hiccup downgrades the author to github-actions[bot] rather than
      # swallowing the guidance entirely.
      - name: Generate App installation token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PEPPER_PR_REVIEW_APP_ID }}
          private-key: ${{ secrets.PEPPER_PR_REVIEW_APP_PRIVATE_KEY }}

      # This body MUST NOT contain the trigger phrase (default `@pepper`).
      # Posted by the Pepper App, it fires an `issue_comment` event, and a body
      # matching `contains(body, @pepper)` would spawn a fresh workflow run on
      # every draft push. Same invariant as the no-verdict escalation comment
      # below — see the longer note there.
      - name: Post draft guidance
        if: needs.gate.outputs.nag == 'true'
        continue-on-error: true
        # SHA-pinned to v3.0.4 (third-party).
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          header: pepper-draft-guidance
          message: |
            This PR is still a draft, so I haven't reviewed it — I wait until it's ready.

            To get a review: mark it **Ready for review**, then push a commit or close and reopen the PR. If you'd rather do nothing, I'll pick it up on my next automated pass; nudging is just faster.

            And if this didn't need to be a draft, opening it ready next time skips the whole step. New to how we run PRs? [Here's the rundown](https://github.com/SpiceLabsHQ/Eng-Cookbook/blob/main/standards/pull-requests.md).

            — Pepper

      # The PR is no longer a draft (or was never one): drop any guidance left
      # from an earlier draft push. A no-op when no such comment exists, which
      # is the common case on a PR opened ready.
      - name: Clear draft guidance
        if: needs.gate.outputs.nag != 'true'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          header: pepper-draft-guidance
          delete: true

  review:
    name: Pepper review
    needs: gate
    runs-on: ubuntu-latest
    # See "Security model" comment at top of file.
    # `issue_comment` is gated to org members so non-members can't trigger
    # secret-bearing runs by typing the trigger phrase on a public PR.
    # `needs.gate` skips runs whose pull_request initiator is a non-allowlisted
    # bot (DEV-504) before claude-code-action can hard-fail on them.
    if: >-
      needs.gate.outputs.run == 'true' &&
      (
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request != null &&
         contains(github.event.comment.body, inputs.trigger_phrase) &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                  github.event.comment.author_association))
      )
    steps:
      - name: Generate App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PEPPER_PR_REVIEW_APP_ID }}
          private-key: ${{ secrets.PEPPER_PR_REVIEW_APP_PRIVATE_KEY }}

      - name: Checkout caller repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # `pull_request` always means review. `issue_comment` splits by body:
      # `@pepper review` (or whatever trigger_phrase is) followed by the word
      # `review` routes to the review prompt with read-only tools; anything
      # else routes to on-demand mode with edit/write/push tools. Keeping the
      # split here means downstream steps stay branch-free on event_name.
      - name: Determine mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
        run: |
          set -euo pipefail
          MODE="on-demand"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            MODE="review"
          elif [ "${EVENT_NAME}" = "issue_comment" ]; then
            NORMALIZED=$(printf '%s' "${COMMENT_BODY}" | tr -s '[:space:]' ' ' | tr '[:upper:]' '[:lower:]')
            TRIGGER_LOWER=$(printf '%s' "${TRIGGER_PHRASE}" | tr '[:upper:]' '[:lower:]')
            case "${NORMALIZED}" in
              *"${TRIGGER_LOWER} review"*) MODE="review" ;;
            esac
          fi
          echo "Resolved mode: ${MODE}"
          echo "mode=${MODE}" >> "${GITHUB_OUTPUT}"

      # DEV-721 — pin the commit this run is reviewing, and expose its short
      # form so Pepper can stamp it on the review body.
      #
      # Why the PR head and not `git rev-parse HEAD`: the checkout above lands
      # on `refs/pull/N/merge` for `pull_request` events, so the working tree's
      # HEAD is a synthetic merge commit that appears nowhere in the PR's commit
      # list. What a reader wants to correlate against is the head commit shown
      # on the PR, which is what `github.event.pull_request.head.sha` carries.
      #
      # Why it matters: a long review can outlive the commit it started on. The
      # author pushes mid-run, and GitHub stamps the filed review's `commit_id`
      # with whatever head is current at submission time — so the PR surface
      # attributes the verdict to a commit Pepper never looked at. Resolving the
      # SHA here, at the start of the run, and carrying it into the body gives
      # the reader a fixed record of what was actually reviewed.
      #
      # Fail-open: `issue_comment` payloads carry no head SHA, so fall back to
      # the PR's current head; if even that is unreadable we emit `unknown` and
      # the prompt drops the stamp rather than failing the review over a
      # cosmetic line.
      - name: Resolve reviewed head SHA
        id: head-sha
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          SHA="${PR_HEAD_SHA}"
          if [ -z "${SHA}" ]; then
            SHA=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefOid --jq '.headRefOid' 2>/dev/null || true)
          fi
          if [ -z "${SHA}" ]; then
            echo "::notice::Could not resolve the PR head SHA — the review will omit its commit stamp (DEV-721)."
            SHORT="unknown"
          else
            # Fixed 7 chars rather than `git rev-parse --short`, whose length is
            # repo-size dependent; the stamp should read identically everywhere.
            SHORT="${SHA:0:7}"
            echo "Reviewing PR #${PR_NUMBER} at head ${SHA} (short: ${SHORT})."
          fi
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"
          echo "short=${SHORT}" >> "${GITHUB_OUTPUT}"

      # `flavor` is a SECOND, orthogonal axis, deliberately not a third `mode`
      # value. `mode` answers "what is Pepper being asked to do" and is consumed
      # at twelve sites in this job (label creation, the cooking marker, the
      # branch switch, the DEV-526 coverage poll/fetch/note, the template case,
      # model resolution, the tool allowlists, the MCP config, the no-verdict
      # escalation, and the cooking cleanup). A third `mode` value would fall off
      # nine of them silently — wrong inference profile and wrong `Mode=` cost tag,
      # no escalation, a permanently stale `pepper-cooking` label. `flavor`
      # answers "what kind of change is this", is consumed ONLY by the template
      # case below, and leaves all twelve `mode` sites untouched. It also gives a
      # defined answer for `@pepper fix this` on a Renovate PR: mode=on-demand,
      # flavor=dependency, which a flat enum could not express.
      #
      # Resolved from the PR AUTHOR, never the initiator. `allowed_bots` is an
      # INITIATOR allowlist (DEV-504) and floor-pepper.yml now passes
      # `pepper-pr-review` in it so the DEV-667 stranded sweep can fire — on a
      # sweep-triggered run the initiator is Pepper's own App while the author is
      # whoever opened the PR, so the two genuinely differ in production.
      #
      # The logins are enumerated, never a `*[bot]` glob. floor-automerge.yml arms
      # auto-merge for exactly these two, and per ADR-0017 an approval on such a
      # PR IS the merge; a glob would hand the dependency risk model (DEV-673) and
      # the collapsed outcome set (DEV-674) to bots nobody vetted for it.
      #
      # The issue_comment fallback is defensive, not a live fix: no caller declares
      # `issue_comment` today (pepper-self-review.yml, floor-pepper.yml), and
      # ruleset injection drops it regardless (DEV-576). It costs nothing and keeps
      # a future caller from silently resolving every comment-triggered run to
      # `default`.
      - name: Determine flavor
        id: flavor
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
        run: |
          set -euo pipefail
          FLAVOR="default"
          case "${PR_AUTHOR}" in
            'renovate[bot]'|'dependabot[bot]') FLAVOR="dependency" ;;
          esac
          echo "Resolved flavor: ${FLAVOR} (PR author: ${PR_AUTHOR:-<unresolved>})"
          echo "flavor=${FLAVOR}" >> "${GITHUB_OUTPUT}"

      # `gh pr edit --add-label "<name>"` errors with `"<name>" not found`
      # when the label doesn't exist in the repo — gh does not auto-create
      # labels on add. Pre-create the four labels Pepper applies so every
      # downstream `--add-label`/`--remove-label` resolves cleanly,
      # including the very first review in a fresh consumer repo.
      # `gh label create` errors when a label already exists; the `|| true`
      # makes the call a no-op so we don't clobber per-repo customization
      # of color or description on existing labels.
      - name: Ensure Pepper labels exist (review mode only)
        if: steps.mode.outputs.mode == 'review'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create "pepper-cooking"           --repo "${REPO}" --color "B87333" --description "Pepper is currently reviewing this PR" 2>/dev/null || true
          gh label create "pepper-approved"          --repo "${REPO}" --color "0E8A16" --description "Pepper approved this PR" 2>/dev/null || true
          gh label create "pepper-changes-requested" --repo "${REPO}" --color "D93F0B" --description "Pepper requested changes" 2>/dev/null || true
          gh label create "pepper-needs-review"      --repo "${REPO}" --color "FBCA04" --description "Pepper needs human review" 2>/dev/null || true

      # Mark this PR as under active Pepper review and clear any prior
      # outcome labels in a single API call. The remove side is gated on
      # labels actually being on the PR — `gh pr edit --remove-label`
      # errors if a label doesn't exist in the repo at all (cold-start
      # case for a fresh repo's first review). Pepper's final action
      # swaps `pepper-cooking` for the chosen outcome label, and the
      # always-on cleanup at the end of the job removes the marker if
      # Pepper never finished. Net: `pepper-cooking` only appears on a
      # PR that is currently being reviewed, never as a stale leftover.
      - name: Mark PR as cooking (review mode only)
        if: steps.mode.outputs.mode == 'review'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          # Build the gh-pr-edit argv as a single array so we never expand
          # an empty array under `set -u` (bash 3.2 / 4.3 footgun: empty
          # `"${arr[@]}"` errors as unbound variable). ARGS always carries
          # the --add-label pair, so the expansion is always safe.
          CURRENT=$(gh pr view "${PR_NUMBER}" --json labels --jq '[.labels[].name] | join(",")')
          ARGS=(--add-label "pepper-cooking")
          for label in pepper-approved pepper-changes-requested pepper-needs-review; do
            case ",${CURRENT}," in
              *,"${label}",*) ARGS+=(--remove-label "${label}") ;;
            esac
          done
          gh pr edit "${PR_NUMBER}" "${ARGS[@]}"

      # `issue_comment` events check out the default branch by default. For on-demand
      # mode (Pepper making edits the user asked for) we need to be on the PR's head
      # branch so commits land on the right ref. Fork PRs aren't supported in
      # on-demand mode — the App token can't push to forks, and we don't want to
      # silently no-op.
      #
      # Gated on resolved mode rather than event name so a `@pepper review`
      # comment on a fork PR isn't blocked by the fork-fail below — review mode
      # doesn't need branch switching at all (it reads the diff via gh).
      - name: Switch to PR head branch (on-demand mode only)
        if: steps.mode.outputs.mode == 'on-demand'
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # The action's app-slug output is the App's URL slug. If a future
          # minor of actions/create-github-app-token drops the output (or this
          # workflow is called via an older pin), fall back to a hardcoded slug
          # for the SpiceLabsHQ App.
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          PR_JSON=$(gh pr view "${PR_NUMBER}" --json headRefName,headRepositoryOwner,isCrossRepository)
          HEAD_REF=$(echo "${PR_JSON}" | jq -r '.headRefName')
          IS_FORK=$(echo "${PR_JSON}" | jq -r '.isCrossRepository')
          if [ "${IS_FORK}" = "true" ]; then
            echo "::error::PR #${PR_NUMBER} is from a fork; on-demand mode is not supported for fork PRs (App token cannot push to forks)."
            exit 1
          fi
          git fetch origin "${HEAD_REF}":"${HEAD_REF}"
          git checkout "${HEAD_REF}"

          if [ -z "${APP_SLUG}" ]; then
            echo "::error::actions/create-github-app-token did not produce app-slug. Pin to a newer minor of the action that exposes it."
            exit 1
          fi
          BOT_LOGIN="${APP_SLUG}[bot]"
          # Public users endpoint, accessible to install tokens. Brackets URL-encoded.
          BOT_USER_ID=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq '.id')
          git config user.name "${BOT_LOGIN}"
          git config user.email "${BOT_USER_ID}+${BOT_LOGIN}@users.noreply.github.com"
          echo "Switched to PR branch: ${HEAD_REF} (committer: ${BOT_LOGIN})"

      # Coverage consumer, part 1 — SHELL-ONLY poll (DEV-526). No inference is
      # running yet, so waiting here costs build minutes, not model time. Wait
      # (bounded) for the repo's test job to upload its coverage artifact for
      # THIS PR's head SHA. The artifacts API lists an artifact as soon as its
      # upload step finishes — before the producing run completes — so this
      # resolves the moment tests+coverage are done, not when all of CI is.
      # Early-exit once no OTHER CI run for the head SHA is still active: nothing
      # is left to produce the artifact, so a no-coverage repo resolves fast
      # instead of burning the full timeout. Review mode only; a missing artifact
      # is a clean fallback (Pepper reviews off the diff, as before).
      - name: Poll for coverage artifact (review mode only)
        id: coverage-poll
        if: inputs.coverage_review_enabled && steps.mode.outputs.mode == 'review'
        env:
          # Default job token, not the App token: reading artifacts + run status
          # needs only `actions: read`, which the job's permissions block already
          # grants. Using it here keeps the coverage poll working without also
          # requiring the Pepper App installation to carry an Actions permission.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARTIFACT_NAME: ${{ inputs.coverage_artifact }}
          TIMEOUT: ${{ inputs.coverage_poll_timeout_seconds }}
          GRACE: ${{ inputs.coverage_poll_grace_seconds }}
          INTERVAL: ${{ inputs.coverage_poll_interval_seconds }}
          SELF_RUN_ID: ${{ github.run_id }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -uo pipefail
          # pull_request carries the head SHA; an `@pepper review` comment
          # (issue_comment) does not, so resolve it from the PR.
          HEAD_SHA="${PR_HEAD_SHA}"
          if [ -z "${HEAD_SHA}" ]; then
            HEAD_SHA=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefOid --jq '.headRefOid' 2>/dev/null || true)
          fi
          if [ -z "${HEAD_SHA}" ]; then
            echo "::notice::Could not resolve PR head SHA — skipping coverage poll (review continues without a coverage note)."
            echo "found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          START=$(date +%s)
          DEADLINE=$(( START + TIMEOUT ))
          ART_ID=""
          while : ; do
            # Server-side name filter; then match the PR head SHA and take the
            # newest live artifact. A per-element select is pagination-safe.
            ART_ID=$(gh api "/repos/${REPO}/actions/artifacts?per_page=100&name=${ARTIFACT_NAME}" \
              --jq "[.artifacts[] | select(.workflow_run.head_sha == \"${HEAD_SHA}\" and .expired == false)] | sort_by(.created_at) | last | .id // empty" \
              2>/dev/null || true)
            if [ -n "${ART_ID}" ]; then
              echo "Found '${ARTIFACT_NAME}' artifact (id=${ART_ID}) for ${HEAD_SHA}."
              break
            fi
            NOW=$(date +%s)
            if [ "${NOW}" -ge "${DEADLINE}" ]; then
              echo "::notice::Coverage artifact '${ARTIFACT_NAME}' did not appear within ${TIMEOUT}s — reviewing without a coverage note."
              break
            fi
            # After the grace window, give up early only when some OTHER run for
            # this SHA has finished AND none is still active. This Pepper run is
            # excluded so its own in_progress state can't hold the poll open
            # forever; requiring a COMPLETED other run avoids a premature exit in
            # the same-run layout (tests + Pepper in one workflow), where self is
            # the only run — there we fall through to the absolute timeout and
            # still catch the artifact once the sibling test job uploads it.
            if [ $(( NOW - START )) -ge "${GRACE}" ]; then
              RUNS_JSON=$(gh run list --repo "${REPO}" --commit "${HEAD_SHA}" --limit 100 --json databaseId,status 2>/dev/null || echo '[]')
              OTHER_ACTIVE=$(printf '%s' "${RUNS_JSON}" | jq "[.[] | select((.databaseId|tostring) != \"${SELF_RUN_ID}\") | select(.status != \"completed\")] | length" 2>/dev/null || echo 1)
              OTHER_DONE=$(printf '%s' "${RUNS_JSON}" | jq "[.[] | select((.databaseId|tostring) != \"${SELF_RUN_ID}\") | select(.status == \"completed\")] | length" 2>/dev/null || echo 0)
              if [ "${OTHER_ACTIVE:-1}" = "0" ] && [ "${OTHER_DONE:-0}" -gt 0 ]; then
                echo "::notice::All other CI runs for ${HEAD_SHA} finished and no '${ARTIFACT_NAME}' artifact was produced — reviewing without a coverage note."
                break
              fi
            fi
            sleep "${INTERVAL}"
          done

          if [ -z "${ART_ID}" ]; then
            echo "found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # `gh api .../zip` follows the 302 to blob storage and streams the
          # archive; it works while the producing run's other jobs still run.
          DL_DIR="${RUNNER_TEMP}/coverage-artifact"
          mkdir -p "${DL_DIR}"
          if ! gh api "/repos/${REPO}/actions/artifacts/${ART_ID}/zip" > "${DL_DIR}/artifact.zip" 2>/dev/null; then
            echo "::notice::Failed to download coverage artifact ${ART_ID} — reviewing without a coverage note."
            echo "found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          unzip -o -q "${DL_DIR}/artifact.zip" -d "${DL_DIR}" 2>/dev/null || true
          COV_FILE=$(find "${DL_DIR}" -type f ! -name 'artifact.zip' | head -n1)
          if [ -z "${COV_FILE}" ]; then
            echo "::notice::Coverage artifact contained no file — reviewing without a coverage note."
            echo "found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "found=true" >> "${GITHUB_OUTPUT}"
          echo "file=${COV_FILE}" >> "${GITHUB_OUTPUT}"

      # Coverage consumer, part 2 — fire deterministic tooling ONCE, after the
      # poll resolves (DEV-526). diff-cover (not the model) computes the note;
      # the agent later spends its inference JUDGING it, never waiting for it.
      # Always produces a note file: the real diff-coverage note when the
      # artifact arrived, or a "no coverage this run" marker otherwise. The note
      # is folded into the review prompt by the Build prompt step. NON-GATING:
      # nothing here can fail the job (`|| true` / fallbacks throughout).
      # Fetch the standalone note renderer from .github at this workflow's own
      # SHA (version-matched, like the prompt) so the next step runs the exact
      # program the fixture test verifies. Coverage mode only.
      - name: Fetch coverage note renderer (coverage mode only)
        if: inputs.coverage_review_enabled && steps.mode.outputs.mode == 'review'
        uses: actions/checkout@v7
        with:
          repository: SpiceLabsHQ/.github
          ref: ${{ job.workflow_sha }}
          path: .pepper-coverage-tpl
          sparse-checkout: .github/actions/coverage-surface/note.jq
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Build coverage note (review mode only)
        id: coverage-note
        if: inputs.coverage_review_enabled && steps.mode.outputs.mode == 'review'
        env:
          FOUND: ${{ steps.coverage-poll.outputs.found }}
          COV_FILE: ${{ steps.coverage-poll.outputs.file }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
          # Default job token — only reads PR metadata (base branch). See the
          # poll step above for why this isn't the App token.
          GH_TOKEN: ${{ github.token }}
          DIFF_COVER_VERSION: "10.3.0"
        run: |
          set -uo pipefail
          NOTE="${RUNNER_TEMP}/coverage-note.md"
          fallback() {
            printf '%s\n' "_$1 Review off the diff; do not read the absence of a coverage note as either good or bad coverage._" > "${NOTE}"
            echo "path=${NOTE}" >> "${GITHUB_OUTPUT}"
            exit 0
          }

          [ "${FOUND}" = "true" ] && [ -n "${COV_FILE:-}" ] || \
            fallback "No diff-coverage signal for this run (the repo published no coverage artifact, or it did not arrive in time)."

          # issue_comment carries no pull_request payload, so resolve the base.
          BASE="${BASE_REF}"
          if [ -z "${BASE}" ]; then
            BASE=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json baseRefName --jq '.baseRefName' 2>/dev/null || true)
          fi
          [ -n "${BASE}" ] || fallback "A coverage artifact was present but the base branch could not be resolved, so diff coverage was not computed."

          git fetch --no-tags --quiet origin "${BASE}" 2>/dev/null || true

          # Install diff-cover only now that there IS coverage to read — a repo
          # without coverage pays nothing. pipx is preinstalled on GitHub-hosted
          # ubuntu; fall back to a --user pip install for other images.
          if ! command -v diff-cover >/dev/null 2>&1; then
            pipx install --quiet "diff-cover==${DIFF_COVER_VERSION}" >/dev/null 2>&1 \
              || python3 -m pip install --quiet --disable-pip-version-check --user "diff-cover==${DIFF_COVER_VERSION}" >/dev/null 2>&1 \
              || python3 -m pip install --quiet --disable-pip-version-check --user --break-system-packages "diff-cover==${DIFF_COVER_VERSION}" >/dev/null 2>&1 \
              || true
          fi
          export PATH="${HOME}/.local/bin:${PATH}"
          command -v diff-cover >/dev/null 2>&1 || \
            fallback "A coverage artifact was present but diff-cover could not be installed, so the note was skipped."

          JSON_REPORT="${RUNNER_TEMP}/diff-cover.json"
          diff-cover "${COV_FILE}" --compare-branch "origin/${BASE}" --format "json:${JSON_REPORT}" -q 2>/dev/null || \
            fallback "A coverage artifact was present but diff-cover could not read it against origin/${BASE} (unsupported format or diff error)."

          # Render the prompt note from the JSON with the standalone note.jq
          # program (fetched from .github at job.workflow_sha into
          # .pepper-coverage-tpl). Running the FILE — not an inline copy — means
          # the fixture test in .github/actions/coverage-surface/test/ exercises
          # the exact production program, so the note logic (test-file
          # classification, truncation, soft-flag threshold) cannot drift from
          # what CI verifies. No percentage is ever a gate.
          NOTE_JQ=".pepper-coverage-tpl/.github/actions/coverage-surface/note.jq"
          [ -f "${NOTE_JQ}" ] || \
            fallback "A coverage artifact was present but the note renderer (note.jq) was not found for this workflow version."
          jq -r -f "${NOTE_JQ}" "${JSON_REPORT}" > "${NOTE}" 2>/dev/null || \
            fallback "A coverage artifact was present but the diff-coverage note could not be rendered."

          # Guard against an empty render (jq succeeded but produced nothing).
          [ -s "${NOTE}" ] || fallback "A coverage artifact was present but produced an empty diff-coverage note."
          echo "path=${NOTE}" >> "${GITHUB_OUTPUT}"
          echo "Coverage note written to ${NOTE}:"
          cat "${NOTE}"

      - name: Fetch review prompt template and post-verdict programs
        # Pin the prompt to the SHA of THIS reusable workflow file, so every
        # review uses the prompt that shipped with the workflow version the
        # caller pinned (version-matched, not floating).
        #
        # Use `job.workflow_sha` (the `job` context), which for a workflow_call
        # job resolves to the REUSABLE workflow file's own commit — a SHA that
        # always exists in SpiceLabsHQ/.github, whether the caller is this repo
        # (self-review, local `./` -> the event commit, so main gets the latest
        # prompt and a PR can dogfood its own prompt edits) or an external repo
        # pinning `@pepper-pr-review-v1` (-> that release's commit). NOT
        # `github.workflow_sha`: in a called workflow that is the CALLER's
        # entry-point SHA, which for a cross-repo consumer is a commit in THEIR
        # repo and would fail this checkout.
        #
        # NOT the legacy `refs/tags/v1` this replaced: it is frozen at 60a48c1
        # (README "Versioning & releases" — deprecated, never moves), so every
        # prompt edit since silently never reached any review (DEV-235).
        #
        # The DEV-674 outcome-collapse programs ride along in the same checkout,
        # for the same reason and with the same version-matching: they are the
        # workflow's behavior, they run on the CALLER's runner where this repo's
        # `scripts/` does not exist, and a fix to them must reach a consumer
        # pinned to `@pepper-pr-review-v1` on that tag's commit, not float.
        uses: actions/checkout@v7
        with:
          repository: SpiceLabsHQ/.github
          ref: ${{ job.workflow_sha }}
          path: .pepper-pr-review-tpl
          sparse-checkout: |
            prompts
            scripts/pepper-bot-outcome-collapse.sh
            scripts/pepper-bot-outcome-collapse-decide.jq
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Build prompt
        id: prompt
        env:
          STANDARDS_PATH: ${{ inputs.standards_path }}
          REVIEWERS_TEAM: ${{ inputs.reviewers_team }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          GUIDELINES_MARKER: "<!-- PROJECT_GUIDELINES_PLACEHOLDER -->"
          TASK_MARKER: "<!-- TASK_PLACEHOLDER -->"
          COVERAGE_MARKER: "<!-- COVERAGE_NOTE_PLACEHOLDER -->"
          COVERAGE_NOTE_PATH: ${{ steps.coverage-note.outputs.path }}
          MODE: ${{ steps.mode.outputs.mode }}
          FLAVOR: ${{ steps.flavor.outputs.flavor }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_TIMEOUT_MINUTES: ${{ inputs.review_timeout_minutes }}
          REVIEW_BUDGET_MARGIN_MINUTES: ${{ inputs.review_budget_margin_minutes }}
          HEAD_SHA_SHORT: ${{ steps.head-sha.outputs.short }}
        run: |
          set -euo pipefail

          # Pick the right template for the resolved mode. Each mode has its
          # own purpose-built prompt — sharing a prompt led to the model picking
          # the wrong mode and either reviewing on-demand requests or trying to
          # edit during auto-review.
          # Within review mode, `flavor` selects the risk model the reviewer is
          # given. This is the ONLY consumer of `flavor` — every `mode`-keyed step
          # in this job is untouched by it.
          case "${MODE}" in
            review)
              case "${FLAVOR}" in
                dependency)
                  # DEV-673. The dependency risk model — provenance, what rode
                  # along in the lockfile, license drift, semver honesty, this
                  # repo's usage surface, the CVE urgency asymmetry, repo
                  # invariants, worst-member aggregation on grouped PRs — plus
                  # the {approve, escalate} outcome set, which is the only one a
                  # bot author can act on. The template itself gates on diff
                  # shape, because these authors also open config-migration PRs.
                  #
                  # Safe to point at unconditionally: `.pepper-pr-review-tpl` is
                  # checked out at `job.workflow_sha` — the commit of THIS
                  # workflow file — so the template tree is always the one that
                  # ships with these lines, never the caller's tree and never a
                  # different ref. A caller pinned to an older tag runs that
                  # tag's copy of this `case`, which has no `dependency` arm at
                  # all. The not-found `exit 1` below cannot fire on this path.
                  TEMPLATE=".pepper-pr-review-tpl/prompts/dependency-review-default.md"
                  ;;
                *)
                  # `default`, plus any flavor a future edit forgets to handle:
                  # fall open to the general review template rather than failing
                  # a required check.
                  TEMPLATE=".pepper-pr-review-tpl/prompts/pr-review-default.md"
                  ;;
              esac
              ;;
            on-demand)
              TEMPLATE=".pepper-pr-review-tpl/prompts/on-demand-default.md"
              ;;
            *)
              echo "Unsupported mode: ${MODE}" >&2
              exit 1
              ;;
          esac

          if [ ! -f "${TEMPLATE}" ]; then
            echo "Prompt template not found at ${TEMPLATE}" >&2
            exit 1
          fi

          PROJECT_BLOCK="$(mktemp)"
          if [ -n "${STANDARDS_PATH}" ] && [ -f "${STANDARDS_PATH}" ]; then
            cat "${STANDARDS_PATH}" > "${PROJECT_BLOCK}"
          else
            echo "_None provided. Apply the defaults above._" > "${PROJECT_BLOCK}"
          fi

          # Substitute the project guidelines block (both templates have it).
          ASSEMBLED="$(mktemp)"
          awk -v marker="${GUIDELINES_MARKER}" -v block_file="${PROJECT_BLOCK}" '
            $0 == marker {
              while ((getline line < block_file) > 0) print line
              close(block_file)
              next
            }
            { print }
          ' "${TEMPLATE}" > "${ASSEMBLED}"

          # Fold the DEV-526 diff-coverage note into the review template
          # (review mode only). The coverage-note step always writes a file —
          # a real note or a "no coverage this run" marker — so the placeholder
          # is always resolved. If the tagged template predates the marker, the
          # awk finds no marker line and the note is simply not injected: a
          # clean degradation, never an error.
          if [ "${MODE}" = "review" ] && [ -n "${COVERAGE_NOTE_PATH:-}" ] && [ -f "${COVERAGE_NOTE_PATH}" ]; then
            COVERAGE_ASSEMBLED="$(mktemp)"
            awk -v marker="${COVERAGE_MARKER}" -v block_file="${COVERAGE_NOTE_PATH}" '
              $0 == marker {
                while ((getline line < block_file) > 0) print line
                close(block_file)
                next
              }
              { print }
            ' "${ASSEMBLED}" > "${COVERAGE_ASSEMBLED}"
            mv "${COVERAGE_ASSEMBLED}" "${ASSEMBLED}"
          fi

          # For on-demand, substitute the user's comment in for the task placeholder.
          if [ "${MODE}" = "on-demand" ]; then
            TASK_FILE="$(mktemp)"
            printf '%s\n' "${COMMENT_BODY}" > "${TASK_FILE}"
            ASSEMBLED2="$(mktemp)"
            awk -v marker="${TASK_MARKER}" -v block_file="${TASK_FILE}" '
              $0 == marker {
                while ((getline line < block_file) > 0) print line
                close(block_file)
                next
              }
              { print }
            ' "${ASSEMBLED}" > "${ASSEMBLED2}"
            mv "${ASSEMBLED2}" "${ASSEMBLED}"
          fi

          # Substitute scalar placeholders. reviewers_team is a team slug,
          # PR_NUMBER is a positive integer — neither contains characters that
          # would need escaping for sed's replacement.
          sed -i "s|{{REVIEWERS_TEAM}}|${REVIEWERS_TEAM}|g" "${ASSEMBLED}"
          sed -i "s|{{PR_NUMBER}}|${PR_NUMBER}|g" "${ASSEMBLED}"

          # DEV-534: advertise a budget shorter than the real wall-clock cap
          # (review_timeout_minutes) so the review keeps a margin for the
          # inference tail and its final file-verdict/label actions — the model
          # has no clock and the stop is an ungraceful kill. Clamp to a floor so a
          # small timeout or large margin can't hand the prompt a zero/negative
          # budget. The on-demand template has no {{REVIEW_BUDGET_MINUTES}} token,
          # so this sed is a no-op there.
          REVIEW_BUDGET_MINUTES=$(( REVIEW_TIMEOUT_MINUTES - REVIEW_BUDGET_MARGIN_MINUTES ))
          if [ "${REVIEW_BUDGET_MINUTES}" -lt 5 ]; then
            REVIEW_BUDGET_MINUTES=5
          fi
          sed -i "s|{{REVIEW_BUDGET_MINUTES}}|${REVIEW_BUDGET_MINUTES}|g" "${ASSEMBLED}"

          # DEV-721: the head SHA this run is reviewing, for the review body's
          # commit stamp. Hex or the literal `unknown` — nothing sed would treat
          # specially. The on-demand template carries no {{HEAD_SHA_SHORT}}
          # token, so this sed is a no-op there, and a tagged review template
          # predating the token degrades to no stamp rather than erroring.
          sed -i "s|{{HEAD_SHA_SHORT}}|${HEAD_SHA_SHORT}|g" "${ASSEMBLED}"

          {
            echo 'prompt<<PEPPER_PROMPT_EOF'
            cat "${ASSEMBLED}"
            echo 'PEPPER_PROMPT_EOF'
          } >> "${GITHUB_OUTPUT}"

      # Pick the model identifier the SDK will pass to Bedrock. Per-mode
      # defaults are AWS Application Inference Profiles tagged for cost
      # allocation (Product=pepper, Mode=review|on-demand) so AWS Cost
      # Explorer can attribute spend by flow. The `model` input is an
      # explicit override that wins for both modes — useful for testing a
      # different model on a debug branch, but it forfeits the per-mode
      # cost attribution because override values bypass the tagged profiles.
      - name: Resolve model for this run
        id: model
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          OVERRIDE: ${{ inputs.model }}
          REVIEW_MODEL: ${{ inputs.review_model }}
          ON_DEMAND_MODEL: ${{ inputs.on_demand_model }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE}" ]; then
            RESOLVED="${OVERRIDE}"
            echo "Using override model (cost attribution disabled): ${RESOLVED}"
          elif [ "${MODE}" = "review" ]; then
            RESOLVED="${REVIEW_MODEL}"
            echo "Using review-mode profile: ${RESOLVED}"
          else
            RESOLVED="${ON_DEMAND_MODEL}"
            echo "Using on-demand-mode profile: ${RESOLVED}"
          fi
          echo "model=${RESOLVED}" >> "${GITHUB_OUTPUT}"

      # Emits four outputs consumed by the Run Pepper step's claude_args:
      #   allowed     — the --allowedTools list for this mode
      #   disallowed  — the --disallowedTools list (review mode only; empty on-demand)
      #   max_turns   — turn cap so a looping run can't run away
      #   effort      — reasoning effort (--effort); `high` for both modes
      #
      # Why the review-mode list is shaped this way (DEV-235): the model routes
      # the large majority of its work through Bash and reaches for grep/sed/ls/
      # find and compound commands. A tight Bash allowlist denies those, and in
      # CI there is no human to approve — every denial is a wasted model turn.
      # A live review burned 56 turns / ~9 min / $1.85 with ~18 denials. So we
      # grant the NATIVE read/search tools (Read/Grep/Glob/LS), which bypass the
      # Bash command-parser entirely, plus a set of read-only shell utilities.
      # Writes stay blocked: bare Bash is never granted (no push/rm/commit), and
      # Edit/Write/etc. are hard-denied below because built-in tools would
      # otherwise be auto-included regardless of the allowlist.
      - name: Determine allowed tools for this run
        id: tools
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          # Native read + search tools. These do NOT go through the Bash
          # command-parser, so the model stops shelling out to grep/ls/cat and
          # getting denied.
          READ_TOOLS='Read,Grep,Glob,LS'
          # Read-only git history for change context.
          GIT_TOOLS='Bash(git log:*),Bash(git diff:*),Bash(git blame:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git cat-file:*),Bash(git ls-files:*)'
          # Read-only shell utilities the model still reaches for. Inspection
          # only — no writers, no `bash <script>`, no execution sinks.
          SHELL_TOOLS='Bash(cat:*),Bash(sed:*),Bash(jq:*),Bash(awk:*),Bash(head:*),Bash(tail:*),Bash(sort:*),Bash(uniq:*),Bash(wc:*),Bash(find:*),Bash(rg:*)'
          # gh is the review action surface: read PR/CI context AND post the
          # review, labels, and reviewer assignment. Broad within gh; file
          # writes and pushes are blocked because bare Bash is never granted.
          GH_TOOLS='Bash(gh *)'
          # Read-only fetch for specs/RFCs linked from PR descriptions
          # (replaces the old Bash(curl *), which could also POST).
          FETCH_TOOLS='WebFetch'
          AUTO_TOOLS="${READ_TOOLS},${GIT_TOOLS},${SHELL_TOOLS},${GH_TOOLS},${FETCH_TOOLS}"
          # Whole Linear MCP server, not a hand-curated tool list. The read
          # scope is enforced by the LINEAR_API_KEY itself (a read-only key), so
          # write/delete tools fail at the API even if the model reaches for one.
          # An explicit read-only allowlist kept silently denying legitimate read
          # tools the model wanted (e.g. list_documents / get_document for a
          # linked ADR), and every denial burns a review turn toward the
          # max-turns cap — the exact turn-exhaustion that left PRs unreviewed.
          # SAFETY INVARIANT: this is safe ONLY while LINEAR_API_KEY is
          # read-scoped. If that key is ever swapped for a write-capable one,
          # narrow this back to explicit read tools (or add the Linear write/
          # delete tools to REVIEW_DISALLOWED below) before merging the swap.
          #
          # Syntax: `mcp__<server>__*` is the documented glob for "every tool
          # from this server" (code.claude.com/docs/en/permissions — allow rules
          # accept a tool glob only after a literal `mcp__<server>__` prefix). A
          # bare `mcp__linear` is not the validated form.
          LINEAR_TOOLS='mcp__linear__*'
          ON_DEMAND_TOOLS='Edit,Write,Bash'
          # claude-code-action auto-includes built-in tools (Read, and the file
          # writers) regardless of --allowedTools. To keep review mode truly
          # read-only on the filesystem we must DENY the writers explicitly.
          # We also deny the Linear MCP MUTATION tools by glob. LINEAR_TOOLS
          # above grants the whole `mcp__linear__*` server for maintenance-free
          # reads; these deny globs (deny beats allow) block writes even if a
          # consumer's LINEAR_API_KEY is ever mis-scoped to allow them — so the
          # read-only guarantee no longer rests on the key alone. Every Linear
          # mutation is save_/create_/delete_/prepare_-prefixed; reads (get_/
          # list_/search_) stay allowed.
          REVIEW_DISALLOWED='Edit,Write,MultiEdit,NotebookEdit,mcp__linear__save_*,mcp__linear__create_*,mcp__linear__delete_*,mcp__linear__prepare_*'
          # Reasoning effort. Claude Code's agentic default is `xhigh`, which is
          # tuned for the hardest coding tasks and pays a per-turn latency tax on
          # every one of a review's ~26 turns. A PR review is analytically demanding
          # but bounded (read a diff, pull CI, form a verdict), so `high` is the
          # sweet spot: strong recall, meaningfully faster turns than xhigh. Not
          # lower — `medium`/`low` cut tool calls and investigation depth, which is
          # exactly the recall a review depends on. Per-invocation latency x turn
          # count is the real wall-clock cost (DEV-235), and this is the one safe
          # lever on it. Passed via `--effort` in claude_args below.
          if [ "${MODE}" = "on-demand" ]; then
            echo "allowed=${ON_DEMAND_TOOLS}" >> "${GITHUB_OUTPUT}"
            echo "disallowed=" >> "${GITHUB_OUTPUT}"
            echo "max_turns=60" >> "${GITHUB_OUTPUT}"
            echo "effort=high" >> "${GITHUB_OUTPUT}"
          else
            echo "allowed=${AUTO_TOOLS},${LINEAR_TOOLS}" >> "${GITHUB_OUTPUT}"
            echo "disallowed=${REVIEW_DISALLOWED}" >> "${GITHUB_OUTPUT}"
            # 80, raised from an initial guess of 40 (DEV-235). A large PR (~700
            # changed lines) legitimately exhausted 40 turns with ZERO tool
            # denials — a fast-fail on a healthy review, not a runaway loop. The
            # cap only spends turns a review actually needs, so small PRs are
            # unaffected; it just stops cutting large reviews off before a
            # verdict. Kept below the wall-clock timeout so max-turns stays the
            # graceful primary stop (see the Run Pepper timeout note).
            echo "max_turns=80" >> "${GITHUB_OUTPUT}"
            echo "effort=high" >> "${GITHUB_OUTPUT}"
          fi

      # Wire up Linear's hosted MCP server when LINEAR_API_KEY is set. The
      # action consumes this via `--mcp-config <path>` in claude_args. The bot
      # then has read-only access to Linear via mcp__linear__* tools, which
      # supports graph traversal (sub-issues, parents, related, comments)
      # without the bot needing to write GraphQL or auth headers itself.
      # Runs for any review-mode invocation (pull_request or `@pepper review`
      # comment) so re-reviews get the same Linear context as auto-review.
      - name: Build MCP config (review mode only)
        id: mcp
        if: steps.mode.outputs.mode == 'review'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${LINEAR_API_KEY:-}" ]; then
            echo "No LINEAR_API_KEY — skipping MCP config (Linear access disabled for this run)"
            echo "path=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          MCP_FILE="$(mktemp --suffix=.json)"
          jq -nc --arg key "${LINEAR_API_KEY}" '{
            mcpServers: {
              linear: {
                type: "http",
                url: "https://mcp.linear.app/mcp",
                headers: { Authorization: ("Bearer " + $key) }
              }
            }
          }' > "${MCP_FILE}"
          echo "path=${MCP_FILE}" >> "${GITHUB_OUTPUT}"
          echo "Wrote MCP config to ${MCP_FILE} (Linear server enabled)"

      - name: Configure AWS credentials (Bedrock OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_CLAUDE_BEDROCK_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: pepper-pr-review-${{ github.run_id }}

      # Hard wall-clock cap so a looping or pathologically slow run fails fast
      # instead of dangling (a live review sat at 27+ min under a permission-
      # denial loop — DEV-235; that was the tool-allowlist bug, since fixed, not
      # Bedrock throttling: CloudWatch showed 0 InvocationThrottles across the
      # day's invocations, and the SDK logged no 429/529/retry lines). The real
      # wall-clock cost is per-invocation inference latency (~29s avg, ~166s
      # tail) multiplied by turn count. The `always()` cleanup below still runs
      # when this step times out, so `pepper-cooking` never gets stuck on.
      #
      # `--max-turns` (80 review / 60 on-demand) is the PRIMARY stop and it is
      # graceful: the agent loop ends cleanly and Pepper can still post its
      # verdict. This timeout is only a hang-catcher for a genuinely wedged run.
      # It is sized to NOT trip before max-turns on a healthy review — 80 turns
      # x ~29s avg is ~39 min, so the default 50 min cap leaves headroom for the
      # latency tail before it would SIGKILL a slow-but-healthy review (no
      # verdict). Whichever cap trips, the verdict-signal escalation below handles
      # it gracefully (keyed on the cooking label, not the stop reason). Bumped
      # from 30 min alongside the review max-turns 40 -> 80 (DEV-526): a real
      # 700-line review hit 40 turns with zero denials, so the cap, not a loop,
      # was cutting reviews short.
      #
      # DEV-534: the cap is now the `review_timeout_minutes` input (default 50) so
      # a consumer can tune it, and the review prompt is told a budget of
      # `review_timeout_minutes - review_budget_margin_minutes` (see Build prompt).
      # The model can't see a clock and this stop is an ungraceful kill, so it
      # plans against the shorter advertised budget and files before the real wall.
      - name: Run Pepper
        id: pepper
        uses: anthropics/claude-code-action@v1
        timeout-minutes: ${{ inputs.review_timeout_minutes }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_bedrock: "true"
          trigger_phrase: ${{ inputs.trigger_phrase }}
          # Dependency-update bots may trigger reviews (DEV-494; Renovate is
          # the org's version-update tool, Dependabot still authors security
          # updates). Named bots only — never '*': this repo is public, and
          # the allow-list is the only gate on bot-initiated runs that carry
          # repo secrets. Auto-merge of bot PRs stays off pending DEV-493.
          # Sourced from the `allowed_bots` input (default renovate,dependabot) so
          # the DEV-504 gate job and this parameter share one source of truth.
          allowed_bots: ${{ inputs.allowed_bots }}
          additional_permissions: |
            actions: read
          show_full_output: ${{ inputs.show_full_output }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          # `model`, `--allowedTools`, `--disallowedTools`, and `--max-turns`
          # aren't top-level inputs on claude-code-action@v1; they go through
          # `claude_args` (CLI flags passed to the underlying Claude Code SDK).
          # Without these, the action silently uses defaults, which results in
          # permission denials when Pepper runs gh / git from the prompt.
          # --disallowedTools is omitted for on-demand (empty output) so its
          # Edit/Write grant survives; --max-turns caps runaway loops per mode.
          claude_args: >-
            --model ${{ steps.model.outputs.model }}
            --effort ${{ steps.tools.outputs.effort }}
            --allowedTools "${{ steps.tools.outputs.allowed }}"
            --max-turns ${{ steps.tools.outputs.max_turns }}
            ${{ steps.tools.outputs.disallowed != '' && format('--disallowedTools "{0}"', steps.tools.outputs.disallowed) || '' }}
            ${{ steps.mcp.outputs.path != '' && format('--mcp-config {0}', steps.mcp.outputs.path) || '' }}

      # Bot-PR outcome collapse (DEV-674). On a PR authored by an enumerated
      # dependency bot the outcome set must be {approve, comment + escalate}.
      # `CHANGES_REQUESTED` there is a dead letter: Renovate and Dependabot have
      # no reader for a review body and no reason to push the commit that would
      # clear the verdict, so the PR simply stops. SpiceLabsHQ/.github#138 took
      # six of them in two weeks — every one correct, none actionable:
      #   gh api repos/SpiceLabsHQ/.github/pulls/138/reviews \
      #     --jq '[.[]|.state]|group_by(.)|map({(.[0]):length})|add'
      #     -> {"CHANGES_REQUESTED":6}
      # This generalizes DEV-637: never file a verdict the author has no path to
      # clear.
      #
      # WHY HERE AND NOT IN THE PROMPT. Deleting `--request-changes` from a
      # markdown template is not structural. `GH_TOOLS='Bash(gh *)'` leaves the
      # call fully available, `REVIEW_DISALLOWED` carries no `gh` entries, and
      # prompts/pr-review-default.md actively drives it. That is exactly the
      # in-context rule `<budget_discipline>` documents as unreliable under
      # compaction. Enforcing it after the verdict makes the guarantee
      # independent of what the model chose to do.
      #
      # There is no REST operation that converts a submitted review, and a
      # COMMENT review supersedes nothing (`COMMENTED` is "An informational
      # review" in GitHub's own schema), so the findings are re-filed as a
      # comment and EVERY Pepper `CHANGES_REQUESTED` on the PR is dismissed —
      # they block independently. See the script header for the full argument,
      # the guard against PRs a later approval already cleared, and the
      # dismissal-permission residual.
      #
      # Collapsing does not make the PR mergeable: `reviewDecision` falls to
      # REVIEW_REQUIRED and a COMMENT review does not satisfy the ruleset's
      # `required_approving_review_count: 1`, so escalation is self-clearing by a
      # human while `CHANGES_REQUESTED` terminated nothing.
      #
      # This is the BACKSTOP, not the primary defense. DEV-670's gate skip is what
      # keeps Pepper from reviewing a stale tree in the first place; this step
      # only bounds the damage when that skip mis-evaluates and a verdict is filed
      # against something the bot could never have fixed.
      #
      # `always()` because a Pepper step that timed out or errored may still have
      # submitted the review before it stopped. Runs before the no-verdict
      # escalation, which is a no-op on this path (a posted verdict already
      # cleared `pepper-cooking`). The script never exits non-zero: this workflow
      # is a required check on the floor, and a failed post-verdict cleanup must
      # not turn a completed review red (DEV-504).
      - name: Collapse bot-PR change request into comment + escalation (DEV-674)
        if: always() && steps.mode.outputs.mode == 'review'
        # Backstop, not a budget. The step's `gh` calls are unbounded, and this
        # workflow is a required check on the floor — a hung API call would
        # otherwise hold that check open to the 6h job default in every
        # code-tier repo. Generous enough that a slow-but-live run finishes.
        #
        # `continue-on-error` is load-bearing ALONGSIDE it: a timed-out step is a
        # FAILED step, and without this the backstop would itself turn a
        # completed review red — the exact outcome the `|| true` on the script
        # invocation exists to prevent (DEV-504). Bounded and non-fatal, or
        # neither. On timeout the change request simply stays filed and the next
        # run retries, which is the same safe state as a rejected dismissal.
        timeout-minutes: 5
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          # Author class comes from the `Determine flavor` step (DEV-672), not a
          # second derivation here. That step keys on the PR's AUTHOR, never
          # `github.actor`: the DEV-667 stranded sweep triggers reviews as
          # Pepper's own App, so on that path the initiator is Pepper and the
          # author is Renovate; keying on the initiator would miss every swept
          # bot PR and could misfire on a human one.
          #
          # Single-sourcing matters beyond tidiness. A second copy of the
          # dependency-bot logins in this same file is exactly the drift class
          # DEV-679 exists to catch, in a location its checker does not inspect —
          # the two could disagree silently. One enumeration, one site to audit.
          #
          # `Determine flavor` is unconditional, so this is populated for any run
          # that reached it. This step is `always()`, so on a failure before that
          # point it arrives empty and the collapse stands down — the safe
          # direction, matching the empty-APP_SLUG rule below.
          FLAVOR: ${{ steps.flavor.outputs.flavor }}
          # "<app-slug>[bot]" is Pepper's own review author. Same derivation as the
          # DEV-523 short-circuit in the gate job. Empty when the token action gave
          # no slug, which the decision program treats as "stand down" — dismissing
          # a review we cannot prove is ours is worse than leaving it standing.
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REVIEWERS_TEAM: ${{ inputs.reviewers_team }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          # Author class from `Determine flavor` (DEV-672). Anything other than
          # `dependency` — human, or a bot nobody enumerated — keeps the ordinary
          # outcome set, because it can read a change request and push a fix.
          # Empty means we never reached that step; fall back to `default` so an
          # early failure stands the collapse down rather than firing it blind.
          FLAVOR="${FLAVOR:-default}"
          export FLAVOR
          PEPPER_BOT_LOGIN=""
          [ -n "${APP_SLUG}" ] && PEPPER_BOT_LOGIN="${APP_SLUG}[bot]"
          export PEPPER_BOT_LOGIN
          bash .pepper-pr-review-tpl/scripts/pepper-bot-outcome-collapse.sh || true

      # No-verdict escalation (DEV-235). If Run Pepper ended without posting a
      # verdict, the PR would otherwise be left with no review AND no outcome
      # label — on the PR surface, indistinguishable from "Pepper never ran".
      # Swap the cooking marker for `pepper-needs-review`, tell the author, and
      # assign a human so the PR doesn't sit in limbo. Mirrors the prompt's own
      # halt/escalation path (cannot verify -> defer to a human).
      #
      # Keyed off the VERDICT SIGNAL, not the step's exit code: Pepper swaps
      # `pepper-cooking` for an outcome label when it posts a verdict, so if
      # cooking is still present here, Pepper never finished. This is deliberate
      # — the earlier exit-code gate (failure/cancelled only) missed a graceful
      # `--max-turns` exhaustion, which stops the loop cleanly and exits SUCCESS
      # yet may not have formed a verdict, silently re-creating the limbo this
      # step exists to prevent. Cooking-still-present catches every no-verdict
      # ending at once: timeout SIGKILL, cancellation, mid-run error, AND a clean
      # out-of-turns stop. This runs before the always-on cooking cleanup below,
      # so the marker is still readable at decision time.
      - name: Escalate if Pepper posted no verdict (review mode only)
        if: always() && steps.mode.outputs.mode == 'review'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEWERS_TEAM: ${{ inputs.reviewers_team }}
          REPO_OWNER: ${{ github.repository_owner }}
          HEAD_SHA_SHORT: ${{ steps.head-sha.outputs.short }}
        run: |
          set -uo pipefail
          # A clean review swapped cooking -> pepper-approved/changes-requested
          # itself, so cooking is already gone: nothing to escalate. (A cold-start
          # PR where the cooking step never ran also lands here — also nothing to
          # do.) Only escalate when cooking is still on, i.e. no verdict posted.
          if ! gh pr view "${PR_NUMBER}" --json labels --jq '.labels[].name' 2>/dev/null | grep -Fxq "pepper-cooking"; then
            echo "Pepper posted a verdict (pepper-cooking already cleared) — no escalation needed."
            exit 0
          fi

          gh pr edit "${PR_NUMBER}" --add-label "pepper-needs-review" --remove-label "pepper-cooking" || true

          # This body MUST NOT contain the trigger phrase (default `@pepper`).
          # It is posted by the Pepper App bot via `gh pr comment`, which fires
          # an `issue_comment` event; a body matching `contains(body, @pepper)`
          # would spawn a fresh workflow run every time Pepper escalates. The
          # review job then skips (the bot's author_association is NONE, failing
          # the OWNER/MEMBER gate), so it doesn't loop — but each spawned run
          # churns the `pepper-pr-review-<PR>` concurrency group and can evict a
          # legitimately pending review. So invite the re-run generically, and
          # never hardcode the (configurable) trigger phrase here. DEV-526.
          #
          # DEV-721: name the commit the abandoned run was reading. Without it a
          # reader can't tell whether the stalled pass even covered the code
          # that's on the PR now. Dropped when the SHA didn't resolve, matching
          # the review body's own stamp rule.
          STAMP=""
          if [ -n "${HEAD_SHA_SHORT:-}" ] && [ "${HEAD_SHA_SHORT}" != "unknown" ]; then
            STAMP=" The run was reviewing \`${HEAD_SHA_SHORT}\`."
          fi
          gh pr comment "${PR_NUMBER}" --body "Pepper did not finish this review — the run stopped (timeout, error, or hit its turn limit) before a verdict was posted, so no approval or change request was recorded.${STAMP} Flagging for a human set of eyes. Re-request a review from Pepper once the PR is ready and I will take another pass. — Pepper" || true

          # Best-effort team review request. Tolerate GitHub rejecting it (the
          # team lacks access to this repo, or the token can't request teams) —
          # the label and comment already carry the signal, so a failed request
          # must not fail the job.
          if [ -n "${REVIEWERS_TEAM}" ]; then
            gh pr edit "${PR_NUMBER}" --add-reviewer "${REPO_OWNER}/${REVIEWERS_TEAM}" || true
          fi

      # Always-on cleanup — `pepper-cooking` is purely a "currently being
      # reviewed" marker, so it must come off no matter how this job ended
      # (Pepper success, Pepper failure, prompt-build error, AWS-creds
      # error, runner timeout, manual cancellation). Failed runs are
      # surfaced via the workflow's run status; we don't need a stale
      # label to encode the same signal. The check-before-remove handles
      # the corner case where the cooking step itself failed and the
      # label is not in the repo (would otherwise error on --remove-label).
      - name: Clear pepper-cooking marker
        if: always() && steps.mode.outputs.mode == 'review'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -uo pipefail
          if gh pr view "${PR_NUMBER}" --json labels --jq '.labels[].name' 2>/dev/null | grep -Fxq "pepper-cooking"; then
            gh pr edit "${PR_NUMBER}" --remove-label "pepper-cooking"
          fi
