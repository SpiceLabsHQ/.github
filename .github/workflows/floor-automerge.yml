name: CI Floor — Auto-merge enable

# Standard: implements the auto-merge path of the Eng-Cookbook deployment standard
#           (single trunk -> continuous delivery) —
#           https://github.com/SpiceLabsHQ/Eng-Cookbook/blob/main/standards/pull-requests.md
#
# Central CODE-floor workflow (DEV-502). Registered in `spice-ci-floor-code`
# via the "require workflows to pass" rule, so it runs on every code-tier PR
# with zero per-repo install — the same mechanism as floor-pepper (DEV-499).
#
# WHAT IT DOES: enables ("arms") GitHub native auto-merge (squash) on the PR. The
# PR then merges ITSELF once all required checks are green AND an approving review
# exists. Pepper (floor-pepper) is that reviewer: high-confidence -> approves ->
# merge fires; not confident -> defers to @SpiceLabsHQ/reviewers and does NOT
# approve -> the PR waits for a human. Pepper's deferral IS the human fallback,
# automatically, with no rules to maintain.
#
# THE MERGE GATE IS STILL REVIEW CONFIDENCE, NOT CHANGE TYPE (unchanged). There
# are deliberately no semver tiers (patch/minor/major auto-merge rules). Spice is
# AI-first and has an always-on reviewer, so majors, security bumps, and
# anomalies are all handled by Pepper's judgment + its deferral to humans — not
# by version-delta rules.
#
# WHAT ARMS IS AUTHOR-CLASS SCOPED (the DEV-502 change amended by ADR-0017). The
# gate above is unchanged; what changed is *which PRs auto-arm* here:
#   - BOTS, by default — but only an ENUMERATED allowlist (renovate[bot],
#     dependabot[bot]), NOT a `*[bot]` glob. Every GitHub App login ends in
#     `[bot]`, so a glob would silently arm any future app; the allowlist is the
#     auditable inventory of "who arms automatically." Bots arm by default
#     because no human reads review feedback on a bot's behalf — instant merge on
#     a green + approved bump is the whole point.
#   - HUMANS, per-repo opt-IN — arm only when the repo carries the org custom
#     property `automerge-humans == 'true'` (default absent/false). Arming every
#     human PR was denying authors the experience of *reading Pepper's review*:
#     a high-confidence approval merged instantly and the feedback was never
#     seen. Opt-in makes self-arming a deliberate per-repo choice; elsewhere the
#     author still clicks GitHub's native "Enable auto-merge" button when they
#     want it (per-PR override is GitHub-native — no new machinery here).
#     The opt-in branch is additionally gated on `user.type == 'User'`: the
#     property is REPO-scoped, so without the type gate any unlisted bot's PR
#     in an opt-in repo would arm through it — reopening exactly the hole the
#     enumerated allowlist closes.
#
# ZERO-MINUTE SKIP: the author-class test lives in the JOB-LEVEL `if:` below, which
# GitHub evaluates BEFORE provisioning a runner. A non-arming PR (a human PR in a
# non-opt-in repo, an unlisted bot) therefore skips with zero runner minutes. A
# skipped job still satisfies the ruleset "require workflows to pass" rule — the
# same way the draft and rosemary-releaser skips already do — so the never-
# deadlock invariant holds: skipping is a *pass*, never a red required check.
#
# CUSTOM-PROPERTY MECHANISM: repository custom properties ride in the event
# payload at `github.event.repository.custom_properties`. The `automerge-humans`
# name is hyphenated, so it needs bracket syntax
# (`custom_properties['automerge-humans']`), and property values are STRINGS —
# hence `== 'true'`. See rulesets/README.md for the one-time org mutation that
# defines the property.
#
# FAIL-SAFE DIRECTION: a missing/absent property (the default) makes the `if:`
# false -> the job skips -> the required check counts as PASSING. Worst case, a
# human PR simply doesn't self-arm and its author uses the native auto-merge
# button — never a red required check, never a deadlocked merge.
#
# Renovate PRs also arm auto-merge natively via `platformAutomerge` (shared
# renovate preset, default.json) — a second, consistent bots-by-default arming
# path — so this workflow is the belt-and-suspenders path for the allowlisted
# bots plus opt-in human repos.
#
# See the pull-requests standard and its decision record for the why:
#   https://github.com/SpiceLabsHQ/Eng-Cookbook/blob/main/standards/pull-requests.md
#   https://github.com/SpiceLabsHQ/Eng-Cookbook/blob/main/decisions/ADR-0017-scope-auto-merge-arming.md
#   (ADR-0017 amends ADR-0008 merge-on-review-confidence with author-class arming).
#
# REQUIRED-CHECK SAFETY: zero-install injection only exists via the ruleset
# "required workflows" rule, so this job is a *required* check and must always
# go green — a red required check would DEADLOCK merge. The enable step is
# therefore best-effort and never fails the job. A green check here means only
# "auto-merge enable was attempted."
#
# `synchronize` is in the trigger list so a Renovate rebase (force-push) re-arms
# auto-merge if it was ever cleared — the DEV-497 lesson applied here too.
#
# Skips: drafts (auto-merge arms on the next push after the PR is marked
# ready — ruleset injection drops `ready_for_review`, DEV-576), this `.github` repo (self-skip,
# matching the floor pattern; .github merges its own PRs via its self-* callers +
# Renovate platformAutomerge), rosemary-releaser release PRs (their release loop
# owns their merge; a version bump has nothing to gate), and — new — any PR that
# is neither an allowlisted bot nor a human PR in an `automerge-humans` repo.
#
# The explicit rosemary-releaser exclusion is KEPT, not dropped as redundant: the
# human opt-in clause is REPO-scoped, so in an `automerge-humans` repo a rosemary
# release PR would otherwise self-arm. The exclusion preserves the invariant that
# the release loop — never this workflow — owns release-PR merges, in every repo.

on:
  pull_request:
    # Default activity types only — injection drops anything else (DEV-576);
    # see floor-pepper.yml for the full note.
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      github.repository != 'SpiceLabsHQ/.github' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'rosemary-releaser[bot]' &&
      (
        contains(fromJSON('["renovate[bot]","dependabot[bot]"]'),
                 github.event.pull_request.user.login) ||
        (
          github.event.repository.custom_properties['automerge-humans'] == 'true' &&
          github.event.pull_request.user.type == 'User'
        )
      )
    runs-on: ubuntu-latest
    steps:
      # Enable auto-merge as a GitHub App rather than the built-in GITHUB_TOKEN.
      # WHY: when the PR later merges, GitHub attributes the merge push to
      # whatever actor enabled auto-merge. A merge pushed by GITHUB_TOKEN does
      # NOT fire push/workflow_run-triggered workflows, so a staging deploy wired
      # to trunk pushes silently never runs — the auto-merge<->deploy trigger gap
      # in the deployment standard (DEV-514). An App-authored merge DOES trigger
      # those workflows, closing the gap org-wide.
      #
      # DEDICATED APP: this mints from `spice-automerge`, an app scoped to exactly
      # contents:write + pull-requests:write and nothing else. It is NOT another
      # workflow's app — per the least-privilege / no-credential-reuse rule in the
      # secrets-and-configuration standard (ADR-0007), each CI capability gets its
      # own narrowly-scoped identity.
      #
      # The Client ID is a LITERAL, not a secret. A Client ID is a public
      # identifier — only the private key is a credential — and inlining it leaves
      # `AUTOMERGE_APP_PRIVATE_KEY` as the single value that must be delivered to
      # the run. That matters because org *Actions* secrets are never delivered to
      # Dependabot-triggered runs: GitHub keeps two org secret stores and serves
      # those runs exclusively from the Dependabot one, so every Actions-scoped
      # `secrets.*` reference interpolates to an empty string there, whatever its
      # visibility. `AUTOMERGE_APP_ID` lived only under Actions, so the mint failed
      # on every Dependabot PR and the fallback below quietly took over — meaning
      # the DEV-514 gap this app exists to close was never closed on the Dependabot
      # path (DEV-902). The private key must therefore exist in BOTH stores.
      #
      # This is a top-level ruleset-injected workflow, not a reusable, so there is
      # no `inputs:` block to carry the Client ID the way pepper-pr-review.yml does
      # (DEV-797) — hence the literal, as in pepper-stranded-sweep.yml.
      #
      # SAFETY: this is a *required* check that must always go green or it would
      # deadlock merge. The token mint is best-effort (continue-on-error), and the
      # enable step tries the app token first, then falls back to github.token —
      # both if minting produced no token AND if an app-token enable attempt fails
      # (e.g. app misscoped). The github.token path is byte-for-byte today's
      # behavior, so the worst case degrades silently and never deadlocks a merge.
      - name: Mint app token (optional — enables deploy-triggering merges)
        id: apptoken
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liIYUFfJ6HfbIRTB
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
      - name: Enable auto-merge (squash)
        env:
          APP_TOKEN: ${{ steps.apptoken.outputs.token }}
          GH_FALLBACK: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Best-effort: never fail this (required) check. Already-merged,
          # already-closed, or auto-merge-not-permitted all resolve to a green
          # no-op so merge is never deadlocked by this job.
          #
          # Prefer the app token (its merge triggers deploys). If minting yielded
          # no token, or the app-token enable fails for any reason, fall back to
          # github.token so auto-merge is still enabled — the required check stays
          # green either way. A github.token merge just won't trigger downstream
          # deploy workflows (the DEV-514 gap), which is exactly today's behavior.
          if [ -n "$APP_TOKEN" ]; then
            echo "::notice::Auto-merge enable actor: github-app spice-automerge (merges trigger deploys)"
            if GH_TOKEN="$APP_TOKEN" gh pr merge --auto --squash "$PR_URL"; then
              echo "Auto-merge enabled (squash, app-authored) on $PR_URL"
              exit 0
            fi
            echo "::warning::App-token auto-merge enable failed — retrying with GITHUB_TOKEN (this merge will NOT trigger deploys)"
          else
            echo "::warning::No app token minted (AUTOMERGE_APP_PRIVATE_KEY absent from this run's secret store, or mint failed) — using GITHUB_TOKEN (merge will NOT trigger deploys)"
          fi
          if GH_TOKEN="$GH_FALLBACK" gh pr merge --auto --squash "$PR_URL"; then
            echo "Auto-merge enabled (squash, github-token fallback) on $PR_URL"
          else
            echo "::notice::Auto-merge not enabled (already merged/closed, or not permitted) — non-fatal"
          fi
