name: CI Floor — Auto-merge enable

# Standard: implements the auto-merge path of the Eng-Cookbook deployment standard
#           (single trunk -> continuous delivery) —
#           https://github.com/SpiceLabsHQ/Eng-Cookbook/blob/main/standards/deployment.md
#
# Central CODE-floor workflow (DEV-502). Registered in `spice-ci-floor-code`
# via the "require workflows to pass" rule, so it runs on every code-tier PR
# with zero per-repo install — the same mechanism as floor-pepper (DEV-499).
#
# WHAT IT DOES: enables GitHub native auto-merge (squash) on the PR. The PR then
# merges ITSELF once all required checks are green AND an approving review
# exists. Pepper (floor-pepper) is that reviewer: high-confidence -> approves ->
# merge fires; not confident -> defers to @SpiceLabsHQ/reviewers and does NOT
# approve -> the PR waits for a human. Pepper's deferral IS the human fallback,
# automatically, with no rules to maintain.
#
# THE MERGE GATE IS REVIEW CONFIDENCE, NOT CHANGE TYPE. There are deliberately
# no semver tiers (patch/minor/major auto-merge rules). Spice is AI-first and
# has an always-on reviewer, so majors, security bumps, and anomalies are all
# handled by Pepper's judgment + its deferral to humans — not by version-delta
# rules. Applies uniformly to bot AND human PRs.
#
# Renovate PRs also enable auto-merge natively via `platformAutomerge` (shared
# renovate preset, default.json), so this workflow is the belt-and-suspenders
# path that covers Dependabot + human PRs uniformly.
#
# REQUIRED-CHECK SAFETY: zero-install injection only exists via the ruleset
# "required workflows" rule, so this job is a *required* check and must always
# go green — a red required check would DEADLOCK merge. The enable step is
# therefore best-effort and never fails the job. A green check here means only
# "auto-merge enable was attempted."
#
# `synchronize` is in the trigger list so a Renovate rebase (force-push) re-arms
# auto-merge if it was ever cleared — the DEV-497 lesson applied here too.
#
# Skips: drafts (auto-merge arms on the next push after the PR is marked
# ready — ruleset injection drops `ready_for_review`, DEV-576), this `.github` repo (self-skip,
# matching the floor pattern; .github merges its own PRs via its self-* callers +
# Renovate platformAutomerge), and rosemary-releaser release PRs (their release
# loop owns their merge; a version bump has nothing to gate).

on:
  pull_request:
    # Default activity types only — injection drops anything else (DEV-576);
    # see floor-pepper.yml for the full note.
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      github.repository != 'SpiceLabsHQ/.github' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'rosemary-releaser[bot]'
    runs-on: ubuntu-latest
    steps:
      # Enable auto-merge as a GitHub App rather than the built-in GITHUB_TOKEN.
      # WHY: when the PR later merges, GitHub attributes the merge push to
      # whatever actor enabled auto-merge. A merge pushed by GITHUB_TOKEN does
      # NOT fire push/workflow_run-triggered workflows, so a staging deploy wired
      # to trunk pushes silently never runs — the auto-merge<->deploy trigger gap
      # in the deployment standard (DEV-514). An App-authored merge DOES trigger
      # those workflows, closing the gap org-wide.
      #
      # DEDICATED APP: this mints from `spice-automerge` (AUTOMERGE_APP_*), an app
      # scoped to exactly contents:write + pull-requests:write and nothing else.
      # It is NOT another workflow's app — per the least-privilege / no-credential-
      # reuse rule in the secrets-and-configuration standard (ADR-0007), each CI
      # capability gets its own narrowly-scoped identity. AUTOMERGE_APP_* are
      # org-level secrets so they resolve in the ruleset-injected required-workflow
      # context on every code-tier repo (repo-scoped secrets would be empty here).
      #
      # SAFETY: this is a *required* check that must always go green or it would
      # deadlock merge. The token mint is best-effort (continue-on-error), and the
      # enable step tries the app token first, then falls back to github.token —
      # both if minting produced no token AND if an app-token enable attempt fails
      # (e.g. app misscoped). The github.token path is byte-for-byte today's
      # behavior, so the worst case degrades silently and never deadlocks a merge.
      - name: Mint app token (optional — enables deploy-triggering merges)
        id: apptoken
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
      - name: Enable auto-merge (squash)
        env:
          APP_TOKEN: ${{ steps.apptoken.outputs.token }}
          GH_FALLBACK: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Best-effort: never fail this (required) check. Already-merged,
          # already-closed, or auto-merge-not-permitted all resolve to a green
          # no-op so merge is never deadlocked by this job.
          #
          # Prefer the app token (its merge triggers deploys). If minting yielded
          # no token, or the app-token enable fails for any reason, fall back to
          # github.token so auto-merge is still enabled — the required check stays
          # green either way. A github.token merge just won't trigger downstream
          # deploy workflows (the DEV-514 gap), which is exactly today's behavior.
          if [ -n "$APP_TOKEN" ]; then
            echo "::notice::Auto-merge enable actor: github-app spice-automerge (merges trigger deploys)"
            if GH_TOKEN="$APP_TOKEN" gh pr merge --auto --squash "$PR_URL"; then
              echo "Auto-merge enabled (squash, app-authored) on $PR_URL"
              exit 0
            fi
            echo "::warning::App-token auto-merge enable failed — retrying with GITHUB_TOKEN (this merge will NOT trigger deploys)"
          else
            echo "::warning::No app token minted (AUTOMERGE_APP_* absent or mint failed) — using GITHUB_TOKEN (merge will NOT trigger deploys)"
          fi
          if GH_TOKEN="$GH_FALLBACK" gh pr merge --auto --squash "$PR_URL"; then
            echo "Auto-merge enabled (squash, github-token fallback) on $PR_URL"
          else
            echo "::notice::Auto-merge not enabled (already merged/closed, or not permitted) — non-fatal"
          fi
