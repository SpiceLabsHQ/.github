name: Release Cascade Check

# Smoke-test workflow that fires on tag push. Its only job is to prove that
# tag pushes from release-please.yml's merge actually trigger downstream
# workflows — which is the whole point of using the Rosemary Releaser
# GitHub App identity instead of GITHUB_TOKEN.
#
# If this workflow runs after a release-please-cut tag, the App auth chain
# is healthy. If a tag pushes and this workflow stays silent, GITHUB_TOKEN
# leaked into the path somewhere and downstream workflows are being
# suppressed.
#
# Safe to delete once the cascade is verified end-to-end.

on:
  push:
    tags: ['v*']

jobs:
  echo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Confirm cascade fired
        run: |
          echo "::notice::Tag-push cascade fired for ${GITHUB_REF_NAME}."
          echo "Tag:        ${GITHUB_REF_NAME}"
          echo "Commit:     ${GITHUB_SHA}"
          echo "Triggered:  ${GITHUB_EVENT_NAME}"
          echo "Actor:      ${GITHUB_ACTOR}"
          echo ""
          echo "If GITHUB_ACTOR above is rosemary-releaser[bot] (or similar"
          echo "GitHub App identity), the tag-cascade auth chain is healthy."
          echo "If it shows a human user or 'github-actions[bot]', double-"
          echo "check that release-please.yml is using the App token path."
