name: Org CI audit mise — test

# Runs the org-ci-audit-mise.jq fixture test (the toolchain-compliance decision
# behind the audit dashboard's `mise` column) on any PR that touches it.
#
# WHY: the audit only ever runs on a weekly schedule against the live org, so a
# defect here does not surface as a red PR — it surfaces as a dashboard that
# quietly says the wrong thing. The expensive failure is the false positive:
# most repos in the org have no language runtime at all, and if those start
# reading as violations the gap list becomes noise and stops being read.

on:
  pull_request:
    paths:
      - "scripts/org-ci-audit-mise.jq"
      - "scripts/org-ci-audit.sh"
      - "scripts/test/org-ci-audit-mise_test.sh"
      - ".github/workflows/org-ci-audit-mise-test.yml"

permissions:
  contents: read

jobs:
  mise-fixtures:
    name: org-ci-audit-mise.jq fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run mise-decision fixture test
        run: scripts/test/org-ci-audit-mise_test.sh
