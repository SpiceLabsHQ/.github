name: CI Floor — secret scan

# Central floor workflow (DEV-499). Referenced by `spice-ci-floor-docs` and
# `spice-ci-floor-code` via the "require workflows to pass" rule; runs on every
# PR in targeted repos with zero per-repo install. See floor-hygiene.yml for the
# mechanism and the `.github` self-host exclusion.
#
# secret-scan gates on findings for ALL repos and additionally uploads SARIF to
# the Security tab on PUBLIC repos only (private repos lack GHAS on the Team
# plan — the upload is visibility-gated inside the reusable). Because this is
# floor for private repos too, that guard is load-bearing.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  secret-scan:
    if: github.repository != 'SpiceLabsHQ/.github'
    uses: SpiceLabsHQ/.github/.github/workflows/secret-scan.yml@secret-scan-v1
    permissions:
      contents: read
      security-events: write
      pull-requests: write
