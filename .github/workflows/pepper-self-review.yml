name: Pepper PR Review

# DO NOT add `pull_request_target` here. That event runs in the base repo's
# context with full secret access even for fork PRs and would let a malicious
# fork diff exfiltrate secrets. Plain `pull_request` is safe because GitHub
# strips secrets from fork PR runs. The reusable workflow further gates
# `issue_comment` to org members only.
on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pepper:
    # Skip release-please's mechanical version-bump PRs: claude-code-action
    # hard-fails on PRs initiated by non-human actors (observed on the first
    # DEV-492 release PR — "Workflow initiated by non-human actor:
    # rosemary-releaser"), and a required check that FAILS blocks the release
    # loop entirely. A SKIPPED job satisfies branch protection, and there's
    # nothing for Pepper to review in a manifest/CHANGELOG/version.txt bump
    # anyway. issue_comment events are unaffected (the expression below is
    # empty-vs-string, i.e. true, for them).
    if: github.event.pull_request.user.login != 'rosemary-releaser[bot]'
    # Local reference: resolves to the same commit as this run, so this repo
    # never pins itself to its own tags (the legacy shared `v1` is frozen —
    # see README "Versioning & releases"). Side effect worth knowing: a PR
    # that edits pepper-pr-review.yml is reviewed by its own modified
    # workflow. Same-repo PR authors are org members, so that's acceptable.
    uses: ./.github/workflows/pepper-pr-review.yml
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
      issues: read
    with:
      # Debug: stream full SDK output so we can inspect tool calls and
      # tune the allowlist. Revisit after the rollout stabilizes.
      show_full_output: true
    secrets:
      AWS_CLAUDE_BEDROCK_ROLE_ARN: ${{ secrets.AWS_CLAUDE_BEDROCK_ROLE_ARN }}
      PEPPER_PR_REVIEW_APP_ID: ${{ secrets.PEPPER_PR_REVIEW_APP_ID }}
      PEPPER_PR_REVIEW_APP_PRIVATE_KEY: ${{ secrets.PEPPER_PR_REVIEW_APP_PRIVATE_KEY }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
