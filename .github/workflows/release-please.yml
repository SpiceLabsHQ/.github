# SpiceLabsHQ — Release Please (reusable)
#
# Trigger:   workflow_call only. Callers wire this to `push` on their default
#            branch and pass `target_branch` if it isn't `main`.
#
# Scope:     Wraps `googleapis/release-please-action`. Maintains a rolling
#            "release PR" for the calling repo using Conventional Commits.
#            When the release PR is merged, release-please tags the new
#            version and creates a GitHub Release. That tag push is the
#            handoff point to the release-artifacts workflow (DEV-223),
#            which builds artifacts, attaches an SBOM and SLSA provenance,
#            and signs with cosign.
#
#            The action is invoked TWICE per run (DEV-533): once to publish
#            releases for merged release PRs, then — after a consistency
#            barrier that waits for those releases to be visible in the
#            Releases listing — once to open/update release PRs. A single
#            invocation does both back-to-back and can read a stale listing
#            that misses a release it published seconds earlier, re-proposing
#            an already-released version as a phantom empty-diff release PR
#            (googleapis/release-please-action#962). See the step comments.
#
# Inputs:    config_file     — path to release-please-config.json
#            manifest_file   — path to .release-please-manifest.json
#            target_branch   — branch release-please opens PRs against
#
# Secrets:   ROSEMARY_RELEASER_APP_ID + ROSEMARY_RELEASER_APP_PRIVATE_KEY (BOTH or NEITHER).
#            When both are provided, this workflow mints a short-lived
#            installation token via actions/create-github-app-token and
#            hands it to release-please. PRs and tags then come from the
#            App identity, and downstream `push` / `pull_request` workflows
#            (most importantly DEV-223 release-artifacts.yml, which is
#            triggered by tag push) DO fire — required for the release
#            chain to work end-to-end.
#
#            When the secrets are absent, the workflow falls back to
#            GITHUB_TOKEN. PRs created with GITHUB_TOKEN are functional,
#            but GitHub deliberately suppresses workflow events triggered
#            by them — meaning a release PR merge will create the tag, but
#            the tag-push event won't trigger release-artifacts.yml in the
#            calling repo. Use the App path for any repo whose release
#            pipeline depends on tag-triggered automation.
#
# Permissions:
#            contents: write       — release-please pushes release commits
#                                    and creates tags on the target branch
#            pull-requests: write  — open / update the rolling release PR
#            (no other permissions; do not add)
#
# Pinning policy:
#            All third-party actions pinned to 40-char commit SHAs per the
#            actions-audit policy (DEV-215). `actions/create-github-app-token`
#            is first-party (`actions/*`) and would qualify for major-tag
#            pinning, but is SHA-pinned anyway because it mints elevated
#            credentials and we want bumps to be deliberate.

name: Release Please (reusable)

on:
  workflow_call:
    inputs:
      config_file:
        description: Path (relative to the calling repo) to the release-please config file.
        required: false
        type: string
        default: release-please-config.json
      manifest_file:
        description: Path (relative to the calling repo) to the release-please manifest file.
        required: false
        type: string
        default: .release-please-manifest.json
      target_branch:
        description: Branch that release-please opens the release PR against. Defaults to `main`.
        required: false
        type: string
        default: main
    secrets:
      ROSEMARY_RELEASER_APP_ID:
        description: |
          GitHub App ID for a dedicated release-bot. Optional. When provided
          together with ROSEMARY_RELEASER_APP_PRIVATE_KEY, the release PR and tags are
          authored by the App, which lets downstream tag-triggered workflows
          (release-artifacts.yml) actually run. If omitted, GITHUB_TOKEN is
          used and tag-push events do NOT cascade to other workflows.
        required: false
      ROSEMARY_RELEASER_APP_PRIVATE_KEY:
        description: PEM private key for the release-bot GitHub App. Required only if ROSEMARY_RELEASER_APP_ID is set.
        required: false

permissions:
  contents: write
  pull-requests: write

# Serialize per target branch. release-please reads HEAD of the branch to
# decide what to bump and to update the rolling PR; two concurrent runs can
# race and produce conflicting "release-please--" branches that need manual
# cleanup. `cancel-in-progress: false` is intentional — we'd rather queue
# than cancel a half-finished PR update.
concurrency:
  group: release-please-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      # GitHub Actions does not let `if:` reference `secrets.*` directly,
      # so we materialize a "do we have App credentials?" boolean by piping
      # the secrets through env (which `if:` CAN see). Either-or-neither is
      # the contract; partial config (just an ID, no key) is treated as
      # "no App" and falls through to GITHUB_TOKEN. We don't error in that
      # case because reusable-workflow secrets can be filtered by the caller
      # and we want the workflow to remain usable without the App for repos
      # that don't need tag-cascade behavior.
      #
      # See: https://docs.github.com/en/actions/security-for-github-actions/security-guides/using-secrets-in-github-actions#using-secrets-in-a-workflow
      # ("you cannot use them directly in if conditionals") — do not
      # "simplify" this back to `if: ${{ secrets.ROSEMARY_RELEASER_APP_ID }}`; that
      # form is silently always-false.
      - name: Detect App credential availability
        id: app-creds
        env:
          ROSEMARY_RELEASER_APP_ID: ${{ secrets.ROSEMARY_RELEASER_APP_ID }}
          ROSEMARY_RELEASER_APP_PRIVATE_KEY: ${{ secrets.ROSEMARY_RELEASER_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${ROSEMARY_RELEASER_APP_ID:-}" ] && [ -n "${ROSEMARY_RELEASER_APP_PRIVATE_KEY:-}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            echo "Using GitHub App identity for release-please."
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "ROSEMARY_RELEASER_APP_ID/ROSEMARY_RELEASER_APP_PRIVATE_KEY not both set; falling back to GITHUB_TOKEN."
            echo "::notice::Tag-push events from release-please will NOT trigger downstream workflows under GITHUB_TOKEN. Configure ROSEMARY_RELEASER_APP_ID + ROSEMARY_RELEASER_APP_PRIVATE_KEY to chain into release-artifacts.yml."
          fi

      - name: Mint GitHub App installation token
        id: app-token
        if: steps.app-creds.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ROSEMARY_RELEASER_APP_ID }}
          private-key: ${{ secrets.ROSEMARY_RELEASER_APP_PRIVATE_KEY }}

      # Pass 1 (DEV-533): publish releases ONLY. Turns merged release PRs into
      # tags + GitHub Releases and swaps their `autorelease: pending` labels to
      # `autorelease: tagged`. PR creation is deferred to pass 2 below so a
      # consistency barrier can sit between the two.
      - name: Run release-please — publish releases (pass 1)
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Prefer the App token when minted; otherwise GITHUB_TOKEN. The
          # `||` here works because `steps.app-token.outputs.token` is the
          # empty string when the previous step was skipped.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: ${{ inputs.config_file }}
          manifest-file: ${{ inputs.manifest_file }}
          target-branch: ${{ inputs.target_branch }}
          skip-github-pull-request: true

      # Consistency barrier (DEV-533). release-please decides what is
      # unreleased by reading the GitHub Releases listing (GraphQL, ordered by
      # CREATED_AT) — which is eventually consistent and can lag a release
      # published seconds earlier. Observed on 2026-07-06: a single run
      # published scorecard-v1.1.1, then re-proposed 1.1.1 as phantom PR #128
      # because the listing still showed v1.1.0 (upstream:
      # googleapis/release-please-action#962, release-please#1208).
      #
      # So: before pass 2 reads that listing, poll the SAME listing until every
      # release pass 1 just published appears in it. This is a read-your-writes
      # barrier keyed on the exact tags created — not a blind sleep. Bounded at
      # ~60s; on timeout we warn and proceed, and the empty-diff backstop below
      # cleans up any phantom that still slips through. Never fails the run.
      - name: Wait for published releases to be listable (consistency barrier)
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          set -uo pipefail
          # Tag names of the releases pass 1 created: the action emits
          # `tag_name` (single-package) and/or `<path>--tag_name` (manifest)
          # outputs. Collect both shapes.
          expected="$(jq -r 'to_entries[]
              | select(.key == "tag_name" or (.key | endswith("--tag_name")))
              | .value' <<<"${RELEASE_OUTPUTS}" | sort -u)"
          if [ -z "${expected}" ]; then
            echo "releases_created=true but no tag_name outputs found; skipping barrier."
            exit 0
          fi
          printf 'Waiting for the Releases listing to include:\n%s\n' "${expected}"
          for attempt in $(seq 1 20); do
            listing="$(gh api graphql \
              -f owner="${GITHUB_REPOSITORY_OWNER}" \
              -f repo="${GITHUB_REPOSITORY#*/}" \
              -f query='query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  releases(first: 100, orderBy: {field: CREATED_AT, direction: DESC}) {
                    nodes { tagName }
                  }
                }
              }' --jq '.data.repository.releases.nodes[].tagName' 2>/dev/null | sort -u)" || listing=""
            missing="$(comm -23 <(printf '%s\n' "${expected}") <(printf '%s\n' "${listing}"))"
            if [ -z "${missing}" ]; then
              echo "All just-published releases visible in the listing (attempt ${attempt})."
              exit 0
            fi
            echo "Not yet listable: $(echo "${missing}" | tr '\n' ' ')— retrying in 3s (attempt ${attempt}/20)"
            sleep 3
          done
          echo "::warning::Releases still missing from the listing after ~60s; proceeding. The empty-diff backstop will close any phantom release PR this may produce (DEV-533)."

      # Pass 2 (DEV-533): open/update release PRs ONLY. Thanks to the barrier
      # above, the unreleased-work scan sees a Releases listing that includes
      # everything pass 1 just published.
      - name: Run release-please — open release PRs (pass 2)
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: ${{ inputs.config_file }}
          manifest-file: ${{ inputs.manifest_file }}
          target-branch: ${{ inputs.target_branch }}
          skip-github-release: true

      # Phantom release-PR backstop (DEV-533).
      #
      # The barrier above prevents phantoms in the expected case, but eventual
      # consistency makes no hard promise — if the listing stays stale past the
      # barrier timeout, pass 2 can still re-propose a just-released version as
      # a release PR whose diff against the target branch is EMPTY (manifest,
      # changelog, and version files already carry that version from the merged
      # release PR).
      #
      # An empty diff is the definitive phantom signature: a legitimate release
      # PR always modifies at least the manifest and a changelog. So: for each
      # PR pass 2 created or updated, close it if its diff is empty, dropping
      # the `autorelease: pending` label first so no later run can mistake it
      # for an untagged release (upstream-recommended hygiene, release-please#1259).
      #
      # Best-effort by design — a backstop failure must never fail the release
      # run that just published real releases.
      - name: Close phantom release PRs (empty diff)
        if: steps.release-please.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PRS: ${{ steps.release-please.outputs.prs }}
        run: |
          set -uo pipefail
          echo "${PRS}" | jq -r '.[].number' | while read -r pr_number; do
            [ -n "${pr_number}" ] || continue
            counts="$(gh pr view "${pr_number}" --repo "${GITHUB_REPOSITORY}" \
              --json additions,deletions,changedFiles \
              --jq '[.additions, .deletions, .changedFiles] | add')" || {
              echo "::warning::Phantom guard: could not inspect PR #${pr_number}; skipping."
              continue
            }
            if [ "${counts}" = "0" ]; then
              echo "PR #${pr_number} has an empty diff — phantom (version already released). Closing."
              gh pr edit "${pr_number}" --repo "${GITHUB_REPOSITORY}" \
                --remove-label "autorelease: pending" || true
              gh pr close "${pr_number}" --repo "${GITHUB_REPOSITORY}" --delete-branch \
                --comment "Auto-closed: phantom release PR with an empty diff — this version is already released. Caused by a stale GitHub Releases listing immediately after tagging (DEV-533; googleapis/release-please-action#962)." || {
                echo "::warning::Phantom guard: failed to close PR #${pr_number}."
              }
            else
              echo "PR #${pr_number} has a non-empty diff (${counts} changed lines+files) — legitimate, leaving open."
            fi
          done
