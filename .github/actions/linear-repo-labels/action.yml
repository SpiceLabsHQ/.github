name: 'Sync Linear repo labels'
description: >-
  Keep a Linear label group in sync with the repositories of a GitHub org or
  user. Tracks repo renames via each repository's immutable numeric ID (stored
  in the label description) so a rename updates the existing label in place —
  no issue associations are lost.
author: 'SpiceLabsHQ'
branding:
  icon: tag
  color: purple

inputs:
  linear-api-key:
    description: >-
      Linear API key (a personal API key, or an OAuth access token) with
      permission to read and write issue labels. Sent verbatim as the
      Authorization header — do NOT prefix it with "Bearer".
    required: true
  github-token:
    description: >-
      Token used to list the target owner's repositories. The default
      GITHUB_TOKEN can only see the repository the workflow runs in, so to
      enumerate an org or user you must supply a token with org/user repo read —
      a fine-grained PAT (Metadata: read) or a GitHub App installation token.
    required: false
    default: ${{ github.token }}
  owner:
    description: 'The GitHub org or user login whose repositories become labels.'
    required: false
    default: ${{ github.repository_owner }}
  group-name:
    description: 'Name of the Linear label group to create and maintain.'
    required: false
    default: 'repo'
  team:
    description: >-
      Linear team key or name to scope the label group to. Leave empty for a
      workspace-level group (visible to every team).
    required: false
    default: ''
  lowercase:
    description: 'Lowercase repository names when writing them as Linear labels.'
    required: false
    default: 'true'
  include-forks:
    description: 'Include forked repositories.'
    required: false
    default: 'true'
  include-archived:
    description: 'Include archived repositories.'
    required: false
    default: 'false'
  prune:
    description: >-
      What to do with a managed label whose repository no longer exists:
      "report" (log only — safest), "archive" (soft-delete, recoverable in
      Linear), or "delete" (permanent; removes the label from any issues).
    required: false
    default: 'report'
  dry-run:
    description: 'Compute and log the plan without mutating Linear.'
    required: false
    default: 'false'

outputs:
  created:
    description: 'Number of labels created.'
    value: ${{ steps.sync.outputs.created }}
  renamed:
    description: 'Number of labels renamed to follow a repo rename.'
    value: ${{ steps.sync.outputs.renamed }}
  adopted:
    description: 'Number of pre-existing labels adopted (stamped with a repo ID).'
    value: ${{ steps.sync.outputs.adopted }}
  pruned:
    description: 'Number of labels pruned (archived or deleted) for gone repos.'
    value: ${{ steps.sync.outputs.pruned }}

runs:
  using: composite
  steps:
    - id: sync
      shell: bash
      env:
        LINEAR_API_KEY: ${{ inputs.linear-api-key }}
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_OWNER: ${{ inputs.owner }}
        INPUT_GROUP_NAME: ${{ inputs.group-name }}
        INPUT_TEAM: ${{ inputs.team }}
        INPUT_LOWERCASE: ${{ inputs.lowercase }}
        INPUT_INCLUDE_FORKS: ${{ inputs.include-forks }}
        INPUT_INCLUDE_ARCHIVED: ${{ inputs.include-archived }}
        INPUT_PRUNE: ${{ inputs.prune }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
      run: ${{ github.action_path }}/sync.sh
